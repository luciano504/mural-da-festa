<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mural da Festa</title>
<meta name="description" content="Fotos, recados, áudios e vídeos dos convidados no telão da festa — e um álbum de recordações no final.">
<meta property="og:title" content="Mural da Festa">
<meta property="og:description" content="Deixe sua homenagem: foto, recado, áudio ou vídeo!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%89%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@500;700&family=Cinzel:wght@600;700&family=Fredoka:wght@400;500;600;700&family=Great+Vibes&family=Luckiest+Guy&family=Pacifico&family=Playfair+Display:wght@600;700&display=swap">
<style>
/* Layout: cada festa veste o próprio tema (tokens trocados por JS); página do convidado = capa + 4 botões + mural; telão = palco em tela cheia; anfitrião e mestre = painéis em abas */
:root{
  --bg:#fffdf7; --bg2:#f3e8ff; --surface:#ffffff; --ink:#2a1745; --muted:#6d5c86;
  --accent:#7b2cbf; --accent2:#ff9f1c; --on:#ffffff; --line:rgba(42,23,69,.12);
  --display:'Luckiest Guy', 'Fredoka', system-ui, sans-serif;
  --body:'Fredoka', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hand:'Caveat', 'Fredoka', cursive;
  --ok:#2f9e44; --bad:#e03131; --warn:#f08c00;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%;overflow-x:hidden;
  background:radial-gradient(120% 70% at 50% -10%, var(--bg2) 0%, transparent 60%), var(--bg)}
[hidden]{display:none!important}
img,video{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
#bgimg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
#bgimg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--veu,.8)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--on);transition:transform .12s, filter .15s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
.btn.alt{background:var(--accent2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff} .btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.in, textarea.in, select.in{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 13px;min-width:0}
textarea.in{min-height:120px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--muted);min-width:0}
.msg{min-height:22px;font-weight:600;font-size:15px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%, transparent);color:var(--accent);font-weight:600;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
h2.sec{font-weight:700;font-size:22px;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.center{text-align:center}

/* ---------- capa do convidado ---------- */
.hero{padding:28px 20px 24px;text-align:center;position:relative;overflow:hidden}
.hero .who{font-family:var(--display);font-size:clamp(44px,11vw,96px);line-height:1.05;margin:10px 0 4px;color:var(--accent);text-wrap:balance;word-break:break-word}
.hero .tit{font-weight:700;font-size:clamp(18px,3.6vw,26px);margin:0;text-wrap:balance}
.hero .sub{font-weight:600;color:var(--accent2);font-size:clamp(16px,3vw,22px);margin-top:4px;filter:brightness(.85)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;color:var(--muted);font-weight:500;margin-top:14px}
.hero .msgf{max-width:620px;margin:14px auto 0;font-size:17px}
.hero .deco{position:absolute;font-size:44px;opacity:.9;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:640px){.acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;border-radius:22px;padding:20px 8px;cursor:pointer;font-weight:700;font-size:17px;
  background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.06);transition:transform .15s}
.act:hover{transform:translateY(-3px)} .act .ic{font-size:40px;line-height:1}
.act:nth-child(1){background:var(--accent);color:var(--on);border-color:transparent}
.act:nth-child(4){background:var(--accent2);color:var(--ink);border-color:transparent}
.namebar{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;justify-content:center}
.namebar .in{max-width:280px}
.closed{padding:16px;border-radius:18px;background:color-mix(in srgb,var(--accent2) 22%, var(--surface));font-weight:600;text-align:center;margin-top:16px}

/* ---------- mural ---------- */
.mural{columns:3 260px;column-gap:12px}
.post{break-inside:avoid;margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.05)}
.post img,.post video{display:block;width:100%;height:auto;background:#000}
.post .pb{padding:10px 14px 12px}
.post .by{font-weight:600;color:var(--muted);font-size:14px}
.post.t .pb{padding:18px 18px 14px}
.post.t blockquote{margin:0 0 8px;font-family:var(--hand);font-size:28px;line-height:1.15;word-break:break-word}
.post.a .pb{display:flex;flex-direction:column;gap:8px}
.post audio{width:100%}
.empty{padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:18px}

/* ---------- folha (envio) ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,8,20,.55);display:grid;place-items:center;backdrop-filter:blur(3px);
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:26px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .25s ease both}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sheet h3{margin:0 0 12px;font-size:24px;display:flex;align-items:center;gap:10px}
.sheet .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:3px dashed var(--line);border-radius:20px;padding:26px 12px;text-align:center;font-weight:600;cursor:pointer;background:var(--bg)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .ic{font-size:44px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugs button{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 10px;cursor:pointer;font-size:14px}
.rec{display:flex;flex-direction:column;align-items:center;gap:12px}
.rec .time{font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.rec canvas{width:100%;height:90px;border-radius:14px;background:var(--bg)}
.recbtn{width:92px;height:92px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 25%, transparent)}
.recbtn.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px color-mix(in srgb,var(--bad) 10%, transparent)}}
.vbox{position:relative;width:100%;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:60vh}
.vbox video{width:100%;height:100%;object-fit:cover;display:block}
.vbox .live{transform:scaleX(-1)}
.vbox .badge{position:absolute;top:10px;left:10px;background:var(--bad);color:#fff;border-radius:999px;padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.alt{font-size:14px;color:var(--muted);text-align:center}
.alt label{text-decoration:underline;cursor:pointer;position:relative}
.alt input{position:absolute;opacity:0;width:1px;height:1px}
.thanks{text-align:center;padding:10px 0}
.thanks .big{font-size:64px}

/* ---------- telão ---------- */
.tv{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:auto 1fr auto;color:var(--ink)}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 3vw 6px}
.tv-top .t{font-family:var(--display);font-size:clamp(28px,4vw,64px);color:var(--accent);line-height:1}
.tv-top .n{font-weight:700;font-size:clamp(16px,1.6vw,26px);color:var(--muted)}
.stage{position:relative;overflow:hidden;margin:0 3vw}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;animation:fadein .8s ease both}
@keyframes fadein{from{opacity:0;transform:scale(.98)}}
.sl.out{animation:fadeout .6s ease both}
@keyframes fadeout{to{opacity:0}}
.sl-foto .ph{max-width:100%;max-height:calc(100% - 11vh);min-height:0;object-fit:contain;border-radius:2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.35);border:1vh solid #fff;animation:kb 10s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.sl .cap{font-family:var(--hand);font-size:clamp(26px,3.4vw,58px);text-align:center;max-width:90%;line-height:1.1}
.sl .cap small{display:block;font-family:var(--body);font-weight:600;font-size:.45em;color:var(--muted);margin-top:.4em}
.sl-texto .q{font-family:var(--hand);text-align:center;max-width:88%;line-height:1.1;word-break:break-word}
.sl-texto .q::before{content:"“";display:block;font-family:var(--display);color:var(--accent);font-size:1.4em;line-height:.6}
.sl-texto .by{font-weight:700;font-size:clamp(20px,2.4vw,40px);color:var(--accent)}
.sl-video video{max-width:100%;max-height:calc(100% - 8vh);min-height:0;border-radius:2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.35);background:#000}
.eq{display:flex;align-items:flex-end;gap:1.2vh;height:28vh}
.eq i{width:3.2vh;border-radius:1.6vh;background:var(--accent);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2n){background:var(--accent2);animation-duration:.8s}
.eq i:nth-child(3n){animation-duration:1.25s}
@keyframes eq{0%,100%{height:15%}50%{height:100%}}
.sl-audio .mic{font-size:12vh}
.tv-bar{display:flex;align-items:center;gap:2vw;padding:1.2vh 3vw 2.2vh}
.tv-bar .qr{background:#fff;padding:1vh;border-radius:1.4vh;line-height:0}
.tv-bar .qr{width:17vh;flex:none}
.tv-bar b{display:block;font-size:clamp(20px,2.6vw,44px);font-family:var(--display);color:var(--accent)}
.tv-bar span{font-weight:600;font-size:clamp(14px,1.5vw,24px);color:var(--muted)}
.tv-bar .acts-mini{margin-left:auto;font-size:clamp(28px,3.4vw,56px);letter-spacing:.2em}
.tv-start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:color-mix(in srgb,var(--bg) 88%, transparent);padding:16px}
.tv-start .who{font-family:var(--display);font-size:clamp(48px,9vw,140px);color:var(--accent);line-height:1}
.tv-empty{display:flex;flex-direction:column;align-items:center;gap:3vh;text-align:center}
.tv-empty .qr{background:#fff;padding:2vh;border-radius:2vh;line-height:0}
.tv-empty .qr{width:40vh}
.tv-empty h2{font-family:var(--display);color:var(--accent);font-size:clamp(32px,5vw,80px);margin:0;font-weight:400}
.tv-empty p{font-size:clamp(18px,2vw,32px);font-weight:600;margin:0;color:var(--muted)}
.tv-hint{position:fixed;right:12px;bottom:8px;z-index:6;font-size:12px;color:var(--muted);opacity:.5}

/* ---------- painéis ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;font-size:clamp(22px,4vw,32px)}
.top h1 em{font-style:normal;font-family:var(--display);color:var(--accent);font-weight:400}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tabs button{border:0;border-radius:999px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:transparent}
.tabs .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;line-height:20px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{display:flex;flex-direction:column;overflow:hidden}
.mod .media img,.mod .media video{display:block;width:100%;max-height:300px;object-fit:cover;background:#000}
.mod .media audio{width:100%;margin-top:10px}
.mod .media blockquote{margin:0;padding:16px;font-family:var(--hand);font-size:24px;line-height:1.15;word-break:break-word;background:var(--bg)}
.mod .info{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);font-weight:500}
.mod .acts2{display:flex;gap:8px;padding:0 12px 12px}
.mod .acts2 .btn{flex:1}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg)}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tema{position:relative;border:3px solid transparent;border-radius:18px;padding:12px;cursor:pointer;text-align:left;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.tema[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface) inset}
.tema .e{font-size:30px}
.tema .nm{font-weight:700;font-size:15px}
.tema .dots{display:flex;gap:4px}
.tema .dots i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.tema .rec{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.85);color:#333}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cat{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 8px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat .e{font-size:30px}
.cat[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%, var(--surface))}
.fest{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.fest h3{margin:0;font-size:18px}
.fest .meta{font-size:14px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.fest .stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fest .acts3{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.fest{grid-template-columns:1fr}.fest .acts3{justify-content:flex-start}}
.linkbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px}
.linkbox code{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:12px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.qrbig{background:#fff;padding:12px;border-radius:16px;display:inline-block;line-height:0;width:224px;max-width:100%}
.landing .hero{padding:44px 20px 30px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.step{padding:18px}
.step .e{font-size:38px}
.step h3{margin:6px 0 4px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.enf{position:absolute;pointer-events:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.18));animation:bob 5s ease-in-out infinite}
.hero .enf.e1{right:-8px;top:-8px;width:min(20%,140px)} .hero .enf.e2{left:-10px;bottom:-10px;width:min(15%,100px);transform:scaleX(-1);animation-delay:-2s}
.hero.tem-enf{padding-left:12%;padding-right:12%}
.tv-enf{height:24vh;width:auto;margin-left:auto;align-self:flex-end;filter:drop-shadow(0 1vh 2vh rgba(0,0,0,.25));animation:bob 5s ease-in-out infinite}
.tv-start .enf-big{max-height:34vh;max-width:70vw;display:block;margin:0 auto 10px}
.sl-texto .q.card-on{background:color-mix(in srgb,var(--surface) 88%, transparent);padding:3vh 4vw;border-radius:3vh}
.up2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.upbox{border:3px dashed var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:var(--bg);position:relative}
.upbox .pv{width:100%;height:170px;border-radius:12px;background:#eee center/contain no-repeat;display:grid;place-items:center;color:var(--muted);font-weight:600}
.upbox .pv.xadrez{background-color:#fff;background-image:linear-gradient(45deg,#e9e9ef 25%,transparent 25%),linear-gradient(-45deg,#e9e9ef 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9e9ef 75%),linear-gradient(-45deg,transparent 75%,#e9e9ef 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.upbox .pv{overflow:hidden;position:relative}
.upbox .pv img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;display:block}
.cores{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.cores label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.cores input[type=color]{width:56px;height:44px;border:2px solid var(--line);border-radius:12px;padding:2px;background:var(--surface);cursor:pointer}
.decl{border:2px solid var(--accent);border-radius:16px;padding:14px;background:color-mix(in srgb,var(--accent) 7%, var(--surface))}
.decl p{margin:0 0 10px;font-size:14px}
.aviso{padding:12px 14px;border-radius:14px;background:#fff3bf;color:#5c4400;font-weight:600}
.legal{max-width:780px}
.legal h2{font-size:20px;margin:26px 0 8px}
.legal p,.legal li{font-size:16px;line-height:1.6}
.nota{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
.nota a,.rod a{color:var(--accent)}
.rod{text-align:center;margin-top:30px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

// ---------- efeito de fundo ----------
const fx = (()=>{
  const cv=$('fx'), c=cv.getContext('2d'); let parts=[], t=null, raf=0, W=0, H=0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ const d=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; c.setTransform(d,0,0,d,0,0); }
  function mk(i){ const p=t.pal; return {x:Math.random()*W, y:Math.random()*H, s:6+Math.random()*16, v:.2+Math.random()*.6, r:Math.random()*6.28, vr:(Math.random()-.5)*.03, c:p[i%p.length], ph:Math.random()*6.28}; }
  function draw(){
    c.clearRect(0,0,W,H);
    for(const p of parts){
      c.save(); c.translate(p.x,p.y); c.globalAlpha = t.dark ? .85 : .55;
      switch(t.pat){
        case 'confete': c.rotate(p.r); c.fillStyle=p.c; c.fillRect(-p.s/2,-p.s/5,p.s,p.s/2.4); break;
        case 'baloes': { const s=p.s*1.8; c.fillStyle=p.c; c.beginPath(); c.ellipse(0,0,s*.42,s*.52,0,0,6.28); c.fill(); c.strokeStyle=p.c; c.lineWidth=1; c.beginPath(); c.moveTo(0,s*.52); c.quadraticCurveTo(6,s*.9,0,s*1.3); c.stroke(); c.globalAlpha*=.6; c.fillStyle='#fff'; c.beginPath(); c.ellipse(-s*.14,-s*.2,s*.08,s*.14,-.5,0,6.28); c.fill(); break; }
        case 'estrelas': { const a=.35+.65*Math.abs(Math.sin(p.ph)); c.globalAlpha=a; c.fillStyle=p.c; c.beginPath(); c.arc(0,0,Math.max(.8,p.s/9),0,6.28); c.fill(); break; }
        case 'bolhas': c.strokeStyle=p.c; c.lineWidth=2; c.beginPath(); c.arc(0,0,p.s*.7,0,6.28); c.stroke(); c.globalAlpha*=.5; c.fillStyle='#fff'; c.beginPath(); c.arc(-p.s*.25,-p.s*.25,p.s*.15,0,6.28); c.fill(); break;
        case 'brilho': { const a=.25+.75*Math.abs(Math.sin(p.ph)); c.globalAlpha=a*(t.dark?.95:.7); c.fillStyle=p.c; const s=p.s*.7; c.beginPath(); c.moveTo(0,-s); c.quadraticCurveTo(0,0,s,0); c.quadraticCurveTo(0,0,0,s); c.quadraticCurveTo(0,0,-s,0); c.quadraticCurveTo(0,0,0,-s); c.fill(); break; }
        case 'petalas': c.rotate(p.r); c.fillStyle=p.c; c.beginPath(); c.ellipse(0,0,p.s*.5,p.s*.22,0,0,6.28); c.fill(); break;
      }
      c.restore();
    }
  }
  function step(){
    for(const p of parts){
      p.ph+=.03; p.r+=p.vr;
      if(t.pat==='baloes'||t.pat==='bolhas'){ p.y-=p.v; p.x+=Math.sin(p.ph)*.3; if(p.y<-60){ p.y=H+40; p.x=Math.random()*W; } }
      else if(t.pat==='estrelas'||t.pat==='brilho'){ p.y+=p.v*.08; if(p.y>H+10) p.y=-10; }
      else { p.y+=p.v; p.x+=Math.sin(p.ph)*.5; if(p.y>H+20){ p.y=-20; p.x=Math.random()*W; } }
    }
    draw(); raf=requestAnimationFrame(step);
  }
  addEventListener('resize', ()=>{ if(t){ size(); draw(); } });
  return {
    start(th){ t=th; cancelAnimationFrame(raf); size(); const n = th.pat==='estrelas' ? 90 : th.pat==='brilho' ? 40 : 34; parts=Array.from({length:n},(_,i)=>mk(i)); draw(); if(!reduce) raf=requestAnimationFrame(step); },
    stop(){ cancelAnimationFrame(raf); c.clearRect(0,0,W,H); }
  };
})();

function qrCanvas(text, size=512){
  const box=document.createElement('div'); box.style.cssText='position:fixed;left:-9999px;top:0';
  document.body.appendChild(box);
  new QRCode(box,{text, width:size, height:size, colorDark:'#111111', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
  const src=box.querySelector('canvas'); const cv=document.createElement('canvas'); cv.width=src.width; cv.height=src.height; cv.getContext('2d').drawImage(src,0,0); box.remove(); return cv;
}
function qrInto(el, text, size){ el.innerHTML=''; const cv=qrCanvas(text, size||360); cv.style.display='block'; cv.style.width='100%'; cv.style.height='auto'; el.appendChild(cv); }

async function encolher(file, max=1600, q=.82){
  let bmp; try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){ bmp=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const k=Math.min(1, max/Math.max(bmp.width,bmp.height)); const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height); return await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
}
function videoThumb(blob){
  return new Promise(res=>{
    const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto'; const url=URL.createObjectURL(blob); v.src=url;
    let done=false; const fin=b=>{ if(done) return; done=true; URL.revokeObjectURL(url); res(b); };
    const grab=()=>{ try{ const w=v.videoWidth||640, h=v.videoHeight||480, k=Math.min(1,900/Math.max(w,h)); const cv=document.createElement('canvas'); cv.width=Math.round(w*k); cv.height=Math.round(h*k); cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height); cv.toBlob(b=>fin(b),'image/jpeg',.82); }catch(e){ fin(null); } };
    v.addEventListener('loadeddata', async ()=>{ try{ await v.play(); await sleep(350); v.pause(); }catch(e){} grab(); }, {once:true});
    v.addEventListener('error', ()=>fin(null), {once:true});
    setTimeout(()=>fin(null), 6000);
  });
}
function duracaoArquivo(file, tag){ return new Promise(res=>{ const el=document.createElement(tag); el.preload='metadata'; const u=URL.createObjectURL(file); el.src=u; el.onloadedmetadata=()=>{ const d=el.duration; URL.revokeObjectURL(u); res(isFinite(d)?d:null); }; el.onerror=()=>{ URL.revokeObjectURL(u); res(null); }; setTimeout(()=>res(null),5000); }); }

async function subir(blob, tipo, ext, contentType){
  const path=`${FESTA.id}/${tipo}-${Date.now()}-${rnd()}.${ext}`;
  const {error}=await sb.storage.from('fe-midia').upload(path, blob, {contentType, upsert:false, cacheControl:'31536000'});
  if(error) throw error; return path;
}
async function gravarPost(row){ const {error}=await sb.from('fe_posts').insert({festa_id:FESTA.id, autor:nomeAtual(), aparelho:deviceId(), ...row}); if(error) throw error; }

// ---------- gravação de áudio e vídeo ----------
function escolherMime(kind){
  const op = kind==='video' ? ['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'] : ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
  if(!window.MediaRecorder) return null; return op.find(m=>{ try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } }) || '';
}
function pararCaptura(){
  if(!recState) return;
  try{ if(recState.rec && recState.rec.state!=='inactive') recState.rec.stop(); }catch(e){}
  try{ recState.stream && recState.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ recState.ac && recState.ac.close(); }catch(e){}
  clearInterval(recState.timer); cancelAnimationFrame(recState.raf); recState=null;
}
function folhaGravar(kind){
  const v = kind==='video';
  const podeGravar = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && escolherMime(kind)!==null);
  abrirFolha(`<h3>${v?'🎥 Recado em vídeo':'🎤 Recado em áudio'}</h3>
   <div class="rec">
     ${v?`<div class="vbox"><video id="gLive" class="live" autoplay muted playsinline></video><video id="gPrev" controls playsinline hidden></video><span class="badge" id="gBadge" hidden>● 0:00</span></div>`
        :`<canvas id="gWave" width="600" height="120"></canvas><audio id="gPrev" controls hidden style="width:100%"></audio>`}
     <div class="time" id="gTime">0:00 <span class="muted" style="font-size:16px">/ ${fmtDur(LIMITE_GRAVACAO)}</span></div>
     <div class="row" style="justify-content:center">
       <button class="recbtn" id="gRec" type="button" ${podeGravar?'':'hidden'}>● Gravar</button>
       ${v?`<button class="btn ghost sm" id="gFlip" type="button" hidden>🔄 Trocar câmera</button>`:''}
       <button class="btn ghost" id="gRedo" type="button" hidden>↺ Gravar de novo</button>
     </div>
     <p class="muted center" style="margin:0;font-size:14px">${podeGravar?`Até ${LIMITE_GRAVACAO/60} minuto. Fale com o coração 💛`:'Seu navegador não grava aqui, mas dá para mandar um arquivo:'}</p>
     <div class="alt"><label>${v?'ou escolher um vídeo do celular':'ou escolher um áudio do celular'}<input type="file" id="gFile" accept="${v?'video/*':'audio/*'}"></label></div>
   </div>
   ${rodapeEnvio('Enviar')}<p class="nota">Ao enviar, você declara que as pessoas que aparecem concordam (no caso de crianças, os pais ou responsáveis) e aceita os <a href="${BASE}?termos" target="_blank" rel="noopener">Termos de uso</a>.</p>`);
  $('eSend').disabled=true;
  let result=null, facing='user';
  ligarRodape(async()=>{
    if(!result) return; const btn=$('eSend'); btn.disabled=true;
    try{
      msgE(`<span class="spin"></span> Enviando ${(result.blob.size/1048576).toFixed(1)} MB… não feche a tela`);
      const path=await subir(result.blob, kind, result.ext, result.type);
      let thumb=null, tb=null;
      if(v){ tb=await videoThumb(result.blob); if(tb) thumb=await subir(tb,'thumb','jpg','image/jpeg'); }
      await gravarPost({tipo:kind, caminho:path, thumb, duracao:Math.min(75,Math.round(result.dur||0)), bytes:result.blob.size+(tb?tb.size:0)});
      agradecer(kind);
    }catch(e){ msgE(ERR(e),'err'); btn.disabled=false; }
  });
  async function abrirCamera(){
    if(!v || !podeGravar) return;
    try{
      pararCaptura();
      const stream=await navigator.mediaDevices.getUserMedia({audio:true, video:{facingMode:facing, width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:24,max:30}}});
      recState={stream}; const live=$('gLive'); live.srcObject=stream; live.hidden=false; $('gPrev').hidden=true; live.classList.toggle('live', facing==='user');
      $('gFlip').hidden=false; msgE('');
    }catch(e){ msgE('Não consegui abrir a câmera. Libere a permissão do navegador ou escolha um vídeo do celular.','err'); }
  }
  const prontos = r => { result=r; $('eSend').disabled=false; $('gRedo').hidden=false; $('gRec').hidden=true; if(v) $('gFlip').hidden=true; msgE(`Pronto! ${fmtDur(r.dur)} gravados. Confira e toque em <b>Enviar</b>.`,'ok'); };
  if(v) abrirCamera();
  if(v) $('gFlip').onclick=()=>{ facing = facing==='user' ? 'environment' : 'user'; abrirCamera(); };
  $('gRedo').onclick=()=>{ result=null; $('eSend').disabled=true; $('gRedo').hidden=true; $('gRec').hidden=!podeGravar; $('gRec').textContent='● Gravar'; $('gTime').firstChild.textContent='0:00 '; const pv=$('gPrev'); pv.hidden=true; pv.removeAttribute('src'); if(v) abrirCamera(); else msgE(''); };
  $('gRec').onclick=async()=>{
    const btn=$('gRec');
    if(recState && recState.rec && recState.rec.state==='recording'){ recState.rec.stop(); return; }
    try{
      if(!v){ pararCaptura(); const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); recState={stream}; }
      if(!recState || !recState.stream){ await abrirCamera(); if(!recState) return; }
      const mime=escolherMime(kind), base=(mime||'').split(';')[0] || (v?'video/webm':'audio/webm');
      const opts = v ? {videoBitsPerSecond:900000, audioBitsPerSecond:96000} : {audioBitsPerSecond:64000};
      if(mime) opts.mimeType=mime;
      const rec=new MediaRecorder(recState.stream, opts); const chunks=[]; recState.rec=rec;
      rec.ondataavailable=ev=>{ if(ev.data && ev.data.size) chunks.push(ev.data); };
      const t0=Date.now();
      rec.onstop=()=>{
        const dur=(Date.now()-t0)/1000; clearInterval(recState&&recState.timer); cancelAnimationFrame(recState&&recState.raf);
        btn.classList.remove('on'); if(v) $('gBadge').hidden=true;
        const blob=new Blob(chunks,{type:base}); const ext = base.includes('mp4') ? (v?'mp4':'m4a') : base.includes('ogg') ? 'ogg' : 'webm';
        if(v){ const live=$('gLive'); live.hidden=true; }
        try{ recState.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
        const pv=$('gPrev'); pv.src=URL.createObjectURL(blob); pv.hidden=false;
        prontos({blob, dur, ext, type:base});
      };
      rec.start(1000); btn.textContent='■ Parar'; btn.classList.add('on'); $('eSend').disabled=true;
      if(v){ $('gFlip').hidden=true; $('gBadge').hidden=false; }
      recState.timer=setInterval(()=>{ const s=(Date.now()-t0)/1000; $('gTime').firstChild.textContent=fmtDur(s)+' '; if(v) $('gBadge').textContent='● '+fmtDur(s); if(s>=LIMITE_GRAVACAO && rec.state==='recording') rec.stop(); },250);
      if(!v){ // ondas do microfone
        const AC=window.AudioContext||window.webkitAudioContext; if(AC){ const ac=new AC(); recState.ac=ac; const src=ac.createMediaStreamSource(recState.stream); const an=ac.createAnalyser(); an.fftSize=256; src.connect(an);
          const data=new Uint8Array(an.frequencyBinCount), cv=$('gWave'), c=cv.getContext('2d'); const cs=getComputedStyle(document.documentElement); const a1=cs.getPropertyValue('--accent').trim(), a2=cs.getPropertyValue('--accent2').trim();
          const loop=()=>{ an.getByteFrequencyData(data); c.clearRect(0,0,cv.width,cv.height); const n=40, w=cv.width/n; for(let i=0;i<n;i++){ const val=data[Math.floor(i*data.length/n/1.5)]/255; const h=Math.max(6,val*cv.height*.95); c.fillStyle=i%2?a2:a1; c.beginPath(); c.roundRect? c.roundRect(i*w+3,(cv.height-h)/2,w-6,h,6) : c.rect(i*w+3,(cv.height-h)/2,w-6,h); c.fill(); } if(recState) recState.raf=requestAnimationFrame(loop); };
          loop(); } }
    }catch(e){ msgE(v?'Não consegui gravar. Libere câmera e microfone ou escolha um vídeo do celular.':'Não consegui usar o microfone. Libere a permissão ou escolha um áudio do celular.','err'); }
  };
  $('gFile').onchange=async e=>{
    const file=e.target.files[0]; e.target.value=''; if(!file) return;
    if(file.size > LIMITE_MB*1048576){ msgE(`Esse arquivo tem ${(file.size/1048576).toFixed(0)} MB. O limite é ${LIMITE_MB} MB — grave um mais curtinho 😉`,'err'); return; }
    const dur=await duracaoArquivo(file, v?'video':'audio');
    if(dur && dur > LIMITE_GRAVACAO+2){ msgE(`Esse ${v?'vídeo':'áudio'} tem ${fmtDur(dur)}. O limite é ${fmtDur(LIMITE_GRAVACAO)}.`,'err'); return; }
    pararCaptura(); if(v){ $('gLive').hidden=true; }
    const pv=$('gPrev'); pv.src=URL.createObjectURL(file); pv.hidden=false;
    const type=file.type || (v?'video/mp4':'audio/mpeg'); const ext=(file.name.split('.').pop()||'').toLowerCase().slice(0,5) || (v?'mp4':'mp3');
    $('gTime').firstChild.textContent=fmtDur(dur||0)+' ';
    prontos({blob:file, dur:dur||0, ext, type});
  };
}

    qrInto($('tvQrBig'), url, 600); tv.cur=null; clearTimeout(tv.timer); tv.timer=setTimeout(proxima, 5000);
  }
  function proxima(back){
    clearTimeout(tv.timer); if(tv.paused) return;
    let p;
    if(back && tv.hist.length>1){ tv.hist.pop(); p=tv.hist.pop(); }
    else if(tv.queue.length) p=tv.queue.shift();
    else if(tv.list.length){ p=tv.list[tv.loop % tv.list.length]; tv.loop++; }
    if(!p) return vazio();
    if(!tv.list.find(x=>x.id===p.id)) return proxima();
    tv.hist.push(p); if(tv.hist.length>50) tv.hist.shift();
    mostrar(p);
  }
  function mostrar(p){
    const st=$('stage'); const old=st.firstElementChild; if(old){ old.classList.add('out'); const o=old; setTimeout(()=>o.remove(),600); old.querySelectorAll('audio,video').forEach(m=>{ try{ m.pause(); }catch(e){} }); }
    const el=document.createElement('div'); el.className='sl'; const by = p.autor ? esc(p.autor) : '';
    let dur=8000;
    if(p.tipo==='foto'){ el.classList.add('sl-foto'); el.innerHTML=`<img class="ph" src="${midia(p.caminho)}" alt="">${(p.texto||by)?`<div class="cap">${esc(p.texto||'')}${by?`<small>📸 ${by}</small>`:''}</div>`:''}`; dur=8000; }
    else if(p.tipo==='texto'){ el.classList.add('sl-texto'); const L=(p.texto||'').length; const fs = L<40?9:L<90?7:L<180?5.4:L<320?4.2:3.4; el.innerHTML=`<div class="q${t.fundo?' card-on':''}" style="font-size:${fs}vw">${esc(p.texto)}</div>${by?`<div class="by">— ${by}</div>`:''}`; dur=Math.min(18000, 7000+L*45); }
    else if(p.tipo==='audio'){ el.classList.add('sl-audio'); el.innerHTML=`<div class="mic">🎤</div><div class="eq">${'<i></i>'.repeat(12)}</div><div class="cap">Recado de ${by||'um convidado'}</div><audio src="${midia(p.caminho)}" preload="auto"></audio>`; dur=null; }
    else if(p.tipo==='video'){ el.classList.add('sl-video'); el.innerHTML=`<video src="${midia(p.caminho)}" playsinline preload="auto" ${p.thumb?`poster="${midia(p.thumb)}"`:''}></video>${by?`<div class="cap"><small>🎥 Recado de ${by}</small></div>`:''}`; dur=null; }
    st.appendChild(el); tv.cur=p;
    const m=el.querySelector('audio,video');
    if(m){ m.onended=()=>proxima(); m.onerror=()=>{ tv.timer=setTimeout(proxima,1500); }; m.play().catch(()=>{ tv.timer=setTimeout(proxima,3000); }); tv.timer=setTimeout(proxima, ((p.duracao||60)+6)*1000); }
    else tv.timer=setTimeout(proxima, dur);
  }
  $('tvGo').onclick=async()=>{
    $('tvStart').hidden=true; tv.started=true;
    try{ await document.documentElement.requestFullscreen(); }catch(e){}
    try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
    await puxar(); proxima();
  };
  document.addEventListener('keydown', e=>{
    if(!tv.started) return;
    if(e.key==='ArrowRight') proxima();
    else if(e.key==='ArrowLeft') proxima(true);
    else if(e.key===' '){ e.preventDefault(); tv.paused=!tv.paused; const m=$('stage').querySelector('.sl:last-child audio,.sl:last-child video'); if(tv.paused){ clearTimeout(tv.timer); m&&m.pause(); $('tvHint').textContent='⏸ pausado (espaço para continuar)'; } else { $('tvHint').textContent=''; m ? m.play().catch(()=>{}) : proxima(); } }
    else if(e.key.toLowerCase()==='f'){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }
  });
  await puxar(); setInterval(puxar, 10000);
}

async function paletaDe(blob){
  const bmp=await createImageBitmap(blob); const k=90/Math.max(bmp.width,bmp.height); const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(bmp.width*k)); cv.height=Math.max(1,Math.round(bmp.height*k));
  const c=cv.getContext('2d'); c.drawImage(bmp,0,0,cv.width,cv.height); const d=c.getImageData(0,0,cv.width,cv.height).data; const caixa={};
  for(let i=0;i<d.length;i+=4){ if(d[i+3]<140) continue; const key=(d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4); (caixa[key]=caixa[key]||{n:0,r:0,g:0,b:0}); const x=caixa[key]; x.n++; x.r+=d[i]; x.g+=d[i+1]; x.b+=d[i+2]; }
  const hsl=(r,g,b)=>{ r/=255;g/=255;b/=255; const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2; let h=0,s=0; if(M!==m){ const dd=M-m; s=l>.5?dd/(2-M-m):dd/(M+m); h = M===r?((g-b)/dd+(g<b?6:0)) : M===g?((b-r)/dd+2) : ((r-g)/dd+4); h*=60; } return [h,s,l]; };
  const hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
  const cores=Object.values(caixa).map(x=>{ const r=x.r/x.n,g=x.g/x.n,b=x.b/x.n,[h,s,l]=hsl(r,g,b); return {hex:hex(r,g,b),n:x.n,h,s,l,score:x.n*(0.2+s)*(l>.12&&l<.88?1:.05)}; }).sort((a,b)=>b.score-a.score);
  const a1=cores[0]||{hex:'#7b2cbf',h:270}; const a2=cores.find(x=>{ const dh=Math.abs(x.h-a1.h); return Math.min(dh,360-dh)>40 && x.s>.25; }) || cores[1] || {hex:'#ff9f1c'};
  return {accent:a1.hex, accent2:a2.hex, bg:mix(a1.hex,'#ffffff',.9)};
}

  const rec=posts.filter(p=>p.tipo==='texto'||p.texto).map(p=>`${new Date(p.criado_em).toLocaleString('pt-BR')} — ${p.autor||'Convidado'}${p.tipo==='foto'?' (legenda de foto)':''}\n${p.texto}\n`).join('\n');

const PW=1240, PH=1754;
function pg(){ const c=document.createElement('canvas'); c.width=PW; c.height=PH; return [c,c.getContext('2d')]; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function wrap(c,text,maxW){ const out=[]; for(const par of String(text).split(/\n/)){ const ws=par.split(/\s+/); let cur=''; for(const w of ws){ const t=cur?cur+' '+w:w; if(c.measureText(t).width>maxW && cur){ out.push(cur); cur=w; } else cur=t; } out.push(cur); } return out; }
function fonte(t){ return `${t.font}, Fredoka, sans-serif`; }
async function fontesProntas(t){ await Promise.all([`400 80px ${t.font}`,'700 40px Caveat','500 30px Caveat','600 30px Fredoka','700 30px Fredoka'].map(x=>document.fonts.load(x).catch(()=>{}))); }
function papel(c, t, f, n){
  const enf=t._enf;
  const g=c.createLinearGradient(0,0,0,PH); g.addColorStop(0,t.paper); g.addColorStop(1,mix(t.paper,t.bg2,.35)); c.fillStyle=g; c.fillRect(0,0,PW,PH);
  c.save(); c.globalAlpha=.35; for(let i=0;i<26;i++){ const x=(i*397)%PW, y=(i*631)%PH; c.fillStyle=t.pal[i%t.pal.length]; c.beginPath(); c.arc(x,y,6+(i%4)*3,0,6.28); c.fill(); } c.restore();
  c.textAlign='center'; c.fillStyle=t.dark?t.bg:t.ink; c.font='600 26px Fredoka, sans-serif'; c.fillText(`${f.homenageado||f.titulo}${f.data?' · '+new Date(f.data+'T12:00:00').toLocaleDateString('pt-BR'):''}`, PW/2, 70);
  c.strokeStyle=t.accent; c.globalAlpha=.6; c.lineWidth=3; c.beginPath(); c.moveTo(380,90); c.lineTo(PW-380,90); c.stroke(); c.globalAlpha=1;
  if(enf){ const h=110, w=h*enf.width/enf.height; c.drawImage(enf,40,PH-40-h,w,h); c.save(); c.translate(PW-40,PH-40-h); c.scale(-1,1); c.drawImage(enf,0,0,w,h); c.restore(); } else { c.font='44px serif'; c.fillText(t.deco[0],90,PH-70); c.fillText(t.deco[1],PW-90,PH-70); }
  c.font='600 26px Fredoka, sans-serif'; c.fillStyle=t.dark?t.bg:t.muted; c.fillText(String(n), PW/2, PH-58);
}
function mix(a,b,k){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const A=p(a),B=p(b); return '#'+A.map((v,i)=>Math.round(v*(1-k)+B[i]*k).toString(16).padStart(2,'0')).join(''); }
function tituloSecao(c,t,txt,sub,y=200){
  c.textAlign='center'; c.fillStyle=t.dark?t.bg:t.accent; c.font=`400 ${/Great|Pacifico/.test(t.font)?110:88}px ${fonte(t)}`; c.fillText(txt, PW/2, y);
  if(sub){ c.font='600 34px Fredoka, sans-serif'; c.fillStyle=t.dark?t.bg:t.ink; c.fillText(sub, PW/2, y+56); }

}
function polaroid(c,im,cx,cy,pw,ph,rot,cap1,cap2,t){
  const pad=24, bottom=cap2?118:94, W=pw+pad*2, H=ph+pad+bottom;
  c.save(); c.translate(cx,cy); c.rotate(rot*Math.PI/180);
  c.shadowColor='rgba(0,0,0,.28)'; c.shadowBlur=26; c.shadowOffsetY=10; c.fillStyle='#fff'; c.fillRect(-W/2,-H/2,W,H); c.shadowColor='transparent';
  const ar=pw/ph, iar=im.width/im.height; let sx=0,sy=0,sw=im.width,sh=im.height; if(iar>ar){ sw=im.height*ar; sx=(im.width-sw)/2; } else { sh=im.width/ar; sy=(im.height-sh)/2; }
  c.drawImage(im,sx,sy,sw,sh,-W/2+pad,-H/2+pad,pw,ph);
  c.fillStyle=t.accent2; c.globalAlpha=.55; c.save(); c.translate(0,-H/2+4); c.rotate(-.04); c.fillRect(-70,-18,140,36); c.restore(); c.globalAlpha=1;

    if(ls.length===1) c.fillText(ls[0],0,H/2-bottom+60); else { c.font=`700 ${Math.min(fs,34)}px Caveat, cursive`; c.fillText(ls[0],0,H/2-bottom+38); c.fillText(ls[1],0,H/2-bottom+70); } }
  if(cap2){ c.font='500 28px Caveat, cursive'; c.fillStyle='#6b6b80'; c.fillText(cap2,0,H/2-18); }
  c.restore();
}
async function carregarImg(path, max=1400){ try{ const b=await fetch(midia(path)).then(r=>{ if(!r.ok) throw 0; return r.blob(); }); const bmp=await createImageBitmap(b); const k=Math.min(1,max/Math.max(bmp.width,bmp.height)); const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k); cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height); return cv; }catch(e){ return null; } }

  if(!FESTAS.length){ $('mList').innerHTML=`<div class="empty">Nenhuma festa ainda. Toque em <b>＋ Nova festa</b> para criar a primeira! 🎈</div>`; return; }
  $('mList').innerHTML=FESTAS.map((f,i)=>{ const t=temaDe(f); return `<div class="card fest" style="margin-bottom:10px;border-left:8px solid ${t.accent}">
    <div><h3>${CATS[f.categoria]?.e||'🎉'} ${esc(f.homenageado||f.titulo)} <span class="pill" style="background:${f.ativo?'#d3f9d8':'#ffe3e3'};color:${f.ativo?'#2b8a3e':'#c92a2a'}">${f.ativo?'ativa':'encerrada'}</span></h3>
      <div class="meta"><span>${esc(f.titulo)}</span>${f.data?`<span>📅 ${new Date(f.data+'T12:00:00').toLocaleDateString('pt-BR')}</span>`:''}<span>${t.e} ${t.n}</span>${f.cliente?`<span>👤 ${esc(f.cliente)}${f.contato?' · '+esc(f.contato):''}</span>`:''}${f.expira_em?`<span>⏳ até ${new Date(f.expira_em+'T12:00:00').toLocaleDateString('pt-BR')}</span>`:''}</div>
      <div class="stats"><span class="pill">💌 ${f.total} homenagens</span>${f.pendentes?`<span class="pill" style="background:#fff3bf">⏳ ${f.pendentes} aguardando</span>`:''}<span class="pill">💾 ${(+f.mb).toFixed(1)} MB</span>${f.tem_custom?`<span class="pill" style="background:${f.custom_bloqueado?'#ffe3e3':f.custom_ativo?'#e7f5ff':'#f1f3f5'}">🖼️ tema próprio ${f.custom_bloqueado?'desligado por você':f.custom_ativo?'ligado':'desligado'}${f.aceite?` · declarado por ${esc(f.aceite.responsavel)} em ${new Date(f.aceite.criado_em).toLocaleDateString('pt-BR')}`:''}</span>`:''}</div></div>
    <div class="acts3"><a class="btn sm" href="${linkFesta(f.slug,'admin')}" target="_blank" rel="noopener">🔐 Anfitrião</a><a class="btn ghost sm" href="${linkFesta(f.slug,'telao')}" target="_blank" rel="noopener">📺 Telão</a><a class="btn ghost sm" href="${linkFesta(f.slug)}" target="_blank" rel="noopener">👀 Ver</a><button class="btn ghost sm" data-i="${i}" data-a="msg">📋 Mensagem</button><button class="btn ghost sm" data-i="${i}" data-a="cfg">⚙️ Ajustes</button>${f.tem_custom?`<button class="btn ${f.custom_bloqueado?'ok':'bad'} sm" data-i="${i}" data-a="bloq">${f.custom_bloqueado?'✓ Liberar tema próprio':'🚫 Desligar tema próprio'}</button>`:''}</div></div>`; }).join('');
  $('mList').querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{ const f=FESTAS[+b.dataset.i]; const a=b.dataset.a;
    if(a==='msg') return copiar(msgCliente(f),'Mensagem para o cliente copiada!');
    if(a==='bloq'){ try{ await rpc('fe_mestre_tema',{p_pin:MPIN,p_id:f.id,p_bloquear:!f.custom_bloqueado}); toast(f.custom_bloqueado?'Tema próprio liberado.':'Tema próprio desligado. A festa voltou ao tema pronto.'); listarFestas(); }catch(e){ toast(ERR(e)); } return; }
    ajustesFesta(f); });
}
function msgCliente(f, senha){
  return `🎉 *Mural da Festa · ${f.titulo}*\n\nO mural está pronto!\n\n📲 *Link para os convidados:*\n${linkFesta(f.slug)}\n\n📺 *Telão* (abra no notebook ligado na TV):\n${linkFesta(f.slug,'telao')}\n\n🔐 *Área do anfitrião* (aprovar homenagens, trocar o tema e baixar o álbum):\n${linkFesta(f.slug,'admin')}${senha?`\nSenha: *${senha}*`:''}\n\nNo fim da festa, baixe o álbum de recordações na área do anfitrião 💛`;
}
function novaFesta(){
  $('app').innerHTML=`<div class="wrap"><div class="top"><h1>＋ Nova festa</h1><button class="btn ghost sm" id="nfVoltar">← Voltar</button></div>${formFesta({categoria:'aniversario',tema:'confete',moderacao:true},{mestre:true})}
    <div class="row" style="justify-content:flex-end;margin-top:12px"><span class="msg" id="nfM"></span><button class="btn" id="nfCriar">🎉 Criar festa</button></div></div>`;
  $('nfVoltar').onclick=()=>{ aplicarTema('confete'); painelMestre(); };
  const ler=ligarFormFesta({categoria:'aniversario',tema:'confete'}, k=>aplicarTema(k));
  $('nfCriar').onclick=async()=>{
    const d=ler(); if(!d.homenageado && !$('ffTit').value.trim()){ $('nfM').className='msg err'; $('nfM').textContent='Preencha o nome do homenageado.'; return; }
    const senha=$('ffSenha').value.trim(); if(senha.length<4){ $('nfM').className='msg err'; $('nfM').textContent='A senha do anfitrião precisa de pelo menos 4 dígitos.'; return; }
    Object.assign(d,{senha_anfitriao:senha, cliente:$('ffCli').value.trim(), contato:$('ffCont').value.trim(), expira_em:$('ffExp').value});
    $('nfCriar').disabled=true; $('nfM').className='msg'; $('nfM').innerHTML='<span class="spin"></span>';
    try{ const f=await rpc('fe_criar_festa',{p_pin:MPIN, d}); festaCriada(f, senha); }catch(e){ $('nfM').className='msg err'; $('nfM').textContent=ERR(e)+' '+(e.message||''); $('nfCriar').disabled=false; }
  };
}
function festaCriada(f, senha){
  aplicarTema(temaDe(f));
  $('app').innerHTML=`<div class="wrap" style="max-width:720px"><div class="card" style="padding:24px;text-align:center"><div style="font-size:64px">${tema(f.tema).e}</div><h1 style="margin:4px 0">Festa criada!</h1>
    <p class="muted">${esc(f.titulo)}</p><div class="qrbig" id="fcQr"></div>
    <div style="text-align:left;margin-top:16px;display:flex;flex-direction:column;gap:10px">
     ${[['📲 Convidados',linkFesta(f.slug)],['📺 Telão',linkFesta(f.slug,'telao')],['🔐 Anfitrião',linkFesta(f.slug,'admin')]].map(([n,u])=>`<div><div style="font-weight:600;font-size:14px;margin-bottom:4px">${n}</div><div class="linkbox"><code>${esc(u)}</code><button class="btn sm" data-copy="${esc(u)}">Copiar</button></div></div>`).join('')}
     <div class="linkbox"><code>Senha do anfitrião: <b>${esc(senha)}</b></code><button class="btn sm" data-copy="${esc(senha)}">Copiar</button></div></div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn alt" id="fcMsg">📋 Copiar mensagem para o cliente</button><button class="btn ghost" id="fcVoltar">Ir para a lista</button></div></div></div>`;
  qrInto($('fcQr'), linkFesta(f.slug), 200);
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copiar(b.dataset.copy));
  $('fcMsg').onclick=()=>copiar(msgCliente(f, senha),'Mensagem copiada! Agora é só colar no WhatsApp do cliente.');
  $('fcVoltar').onclick=()=>{ aplicarTema('confete'); painelMestre(); };
}
function ajustesFesta(f){
  abrirFolha(`<h3>⚙️ ${esc(f.homenageado||f.titulo)}</h3>
    <label class="row" style="font-weight:600;gap:8px"><input type="checkbox" id="ajAtivo" ${f.ativo_flag?'checked':''} style="width:22px;height:22px"> Festa ativa (aceitando homenagens)</label>
    <div class="grid2" style="margin-top:12px"><label class="f">Cliente<input class="in" id="ajCli" maxlength="80" value="${esc(f.cliente||'')}"></label><label class="f">Contato<input class="in" id="ajCont" maxlength="80" value="${esc(f.contato||'')}"></label>
    <label class="f">Válido até<input class="in" id="ajExp" type="date" value="${f.expira_em||''}"></label><label class="f">Nova senha do anfitrião<input class="in" id="ajSenha" maxlength="20" placeholder="deixe vazio para manter"></label></div>
    <div class="msg" id="eMsg"></div><div class="foot" style="justify-content:space-between"><button class="btn bad sm" id="ajDel">🗑️ Excluir festa</button><span class="row"><button class="btn ghost" id="eCancel">Cancelar</button><button class="btn" id="eSend">Salvar</button></span></div>`);
  $('eCancel').onclick=fecharFolha;
  let delArm=false; $('ajDel').onclick=async()=>{ if(!delArm){ delArm=true; $('ajDel').textContent='Toque de novo: apaga tudo desta festa'; setTimeout(()=>{ delArm=false; const b=$('ajDel'); if(b) b.textContent='🗑️ Excluir festa'; },4000); return; }
    try{ await rpc('fe_excluir_festa',{p_pin:MPIN,p_id:f.id}); fecharFolha(); toast('Festa excluída.'); listarFestas(); }catch(e){ msgE(ERR(e),'err'); } };
  $('eSend').onclick=async()=>{ const s=$('ajSenha').value.trim(); if(s && s.length<4){ msgE('A senha precisa de pelo menos 4 dígitos.','err'); return; }
    const d={ativo:$('ajAtivo').checked, cliente:$('ajCli').value.trim(), contato:$('ajCont').value.trim(), expira_em:$('ajExp').value}; if(s) d.nova_senha=s;
    try{ await rpc('fe_mestre_editar',{p_pin:MPIN,p_id:f.id,d}); fecharFolha(); toast(s?`Salvo! Nova senha do anfitrião: ${s}`:'Salvo!', 4000); listarFestas(); }catch(e){ msgE(ERR(e),'err'); } };
}
function trocarMestra(){
  abrirFolha(`<h3>🔑 Trocar senha mestra</h3><p class="muted" style="margin-top:0">A senha mestra abre o painel do organizador e a área de qualquer festa.</p>
   <label class="f">Nova senha (6 ou mais caracteres)<input class="in" id="tmN" type="password" autocomplete="new-password"></label><label class="f" style="margin-top:10px">Repita a nova senha<input class="in" id="tmR" type="password" autocomplete="new-password"></label>
   <div class="msg" id="eMsg"></div><div class="foot"><button class="btn ghost" id="eCancel">Cancelar</button><button class="btn" id="eSend">Trocar</button></div>`);
  $('eCancel').onclick=fecharFolha;
  $('eSend').onclick=async()=>{ const a=$('tmN').value, b=$('tmR').value; if(a.length<6){ msgE('Use pelo menos 6 caracteres.','err'); return; } if(a!==b){ msgE('As duas senhas não estão iguais.','err'); return; }
    try{ await rpc('fe_trocar_mestre',{p_pin:MPIN,p_nova:a}); MPIN=a; store.sset('mf_mestre',a); fecharFolha(); toast('Senha mestra trocada!'); }catch(e){ msgE(ERR(e),'err'); } };
}

// TERMOS DE USO E PRIVACIDADE
// =====================================================================
const CONTATO = '';   // e-mail ou WhatsApp para pedidos de remoção e privacidade
function telaTermos(){
  aplicarTema('confete'); document.title='Termos de uso e Privacidade · Mural da Festa';
  const canal = CONTATO ? `pelo contato <b>${esc(CONTATO)}</b>` : 'falando com o anfitrião da festa ou com o organizador que contratou o Mural da Festa';
  $('app').innerHTML=`<div class="wrap legal"><div class="card" style="padding:24px 22px">
  <h1 style="margin:0">Termos de uso e Política de Privacidade</h1><p class="muted">Mural da Festa · versão de 29/10/2026</p>
  <h2>1. O que é o Mural da Festa</h2>
  <p>Um serviço para festas e eventos em que convidados enviam fotos, recados escritos, áudios e vídeos de homenagem. O anfitrião aprova o que aparece no telão e no mural da festa e, ao final, pode baixar um álbum de recordações e os arquivos enviados.</p>
  <h2>2. Papéis</h2>
  <ul><li><b>Contratante / anfitrião:</b> quem contrata o mural de uma festa e recebe a senha de administração dela. É responsável pela festa, pela moderação e pelo tema escolhido.</li>
  <li><b>Convidado:</b> quem acessa o link ou o QR Code da festa e envia homenagens.</li>
  <li><b>Mural da Festa:</b> fornece a ferramenta e o armazenamento.</li></ul>
  <h2>3. Conteúdo enviado pelos convidados</h2>
  <p>Quem envia uma foto, áudio, vídeo ou recado é responsável por ele. Ao enviar, o convidado declara que as pessoas que aparecem concordam com o envio e que, no caso de crianças e adolescentes, tem a autorização dos pais ou responsáveis. É proibido enviar conteúdo ofensivo, discriminatório, sexual, violento, ilegal ou que viole direitos de terceiros. O anfitrião pode não aprovar ou ocultar qualquer homenagem, e o Mural da Festa pode remover conteúdo que viole estes termos.</p>
  <h2>4. Tema próprio, personagens e direitos autorais</h2>
  <p>O anfitrião pode enviar imagens próprias para decorar a festa (fundo, personagem, enfeite). <b>O Mural da Festa não fornece personagens, marcas ou artes de terceiros.</b> Ao enviar um tema próprio, o anfitrião declara ter autorização para usar todos os elementos enviados e assume <b>integral e exclusiva responsabilidade</b> por eles, inclusive por direitos autorais, marcas e direitos de imagem, isentando o Mural da Festa. A declaração fica registrada com o nome do responsável, a festa, a data e a hora.</p>
  <p>Se alguém (por exemplo, um titular de direitos) se sentir prejudicado por um tema ou conteúdo, pode pedir a remoção ${canal}. Ao receber um pedido fundamentado, o tema próprio pode ser desligado e o conteúdo removido, sem prejuízo da responsabilidade de quem o enviou.</p>
  <h2>5. Privacidade (LGPD)</h2>
  <ul><li><b>Dados tratados:</b> nome ou apelido informado (opcional), fotos, áudios, vídeos e recados enviados, data e hora do envio e um identificador técnico do aparelho, usado só para evitar envios repetidos. Do anfitrião, o nome do responsável pela declaração do tema.</li>
  <li><b>Para quê:</b> exibir as homenagens no telão e no mural da festa, montar o álbum de recordações e permitir que o anfitrião baixe os arquivos.</li>
  <li><b>Base legal:</b> consentimento de quem envia e execução do serviço contratado pelo anfitrião. Para imagens e vozes de crianças e adolescentes, o tratamento é feito no seu melhor interesse e depende do consentimento dos pais ou responsáveis (art. 14 da LGPD).</li>
  <li><b>Quem vê:</b> as homenagens aprovadas ficam visíveis para quem tem o link da festa. Os arquivos ficam guardados em provedor de nuvem contratado e são acessíveis pelo endereço de cada arquivo. Não vendemos nem compartilhamos dados com terceiros para publicidade.</li>
  <li><b>Por quanto tempo:</b> enquanto a festa estiver ativa e por até 90 dias depois da data de validade combinada com o contratante, ou menos, se ele pedir a exclusão antes. Depois disso, os dados podem ser apagados definitivamente.</li>
  <li><b>Seus direitos:</b> você pode pedir acesso, correção ou exclusão do que enviou, ou retirar o consentimento, ${canal}.</li></ul>
  <h2>6. Limitações</h2>
  <p>O serviço depende de internet e de provedores de nuvem e pode ter instabilidades. Recomendamos que o anfitrião baixe o álbum e os arquivos logo após a festa. O Mural da Festa não se responsabiliza por conteúdo enviado por usuários nem por temas enviados pelo anfitrião.</p>
  <h2>7. Mudanças nestes termos</h2>
  <p>Estes termos podem ser atualizados. A versão em vigor é sempre a publicada nesta página. Aplica-se a legislação brasileira.</p>
  </div><p class="center" style="margin-top:16px"><a class="btn ghost" href="${BASE}">Voltar</a></p></div>`;
}

// INÍCIO (página de apresentação)

function telaInicio(){
  aplicarTema('confete');
  $('app').innerHTML=`<div class="wrap landing">
   <section class="card hero"><span class="deco" style="left:5%;top:12%">🎈</span><span class="deco" style="right:6%;top:16%;animation-delay:-1.4s">🎂</span><span class="deco" style="right:14%;bottom:10%;animation-delay:-2.2s">💍</span>
     <span class="chip">📸 ✍️ 🎤 🎥</span><div class="who" style="font-size:clamp(46px,10vw,92px)">Mural da Festa</div>
     <p class="tit" style="max-width:640px;margin:6px auto 0">Os convidados mandam fotos, recados, áudios e vídeos pelo celular. As homenagens aparecem no telão durante a festa e viram um álbum de recordações no final.</p>
     <form class="row" id="inF" style="justify-content:center;margin-top:20px"><input class="in" id="inC" placeholder="Código da festa (ex.: maria-clara-5068)" style="max-width:320px"><button class="btn">Entrar na festa</button></form></section>
   <h2 class="sec">Como funciona</h2>
   <div class="steps">
     <div class="card step"><div class="e">📲</div><h3>1. Convidado aponta a câmera</h3><p class="muted">QR Code na mesa ou link no grupo. Sem baixar aplicativo e sem cadastro.</p></div>
     <div class="card step"><div class="e">💌</div><h3>2. Manda a homenagem</h3><p class="muted">Foto, recado escrito, áudio ou vídeo de até 1 minuto.</p></div>
     <div class="card step"><div class="e">✅</div><h3>3. Anfitrião aprova</h3><p class="muted">Nada aparece no telão sem passar pelo filtro de quem organiza.</p></div>
     <div class="card step"><div class="e">📺</div><h3>4. Telão e álbum</h3><p class="muted">Tudo passa no telão durante a festa. No fim, o álbum em PDF e todos os arquivos.</p></div>
   </div>
   <h2 class="sec">Para todo tipo de festa</h2>
   <div class="cats">${Object.values(CATS).map(c=>`<div class="cat" style="cursor:default"><span class="e">${c.e}</span>${c.n}</div>`).join('')}</div>
   <p class="center" style="margin-top:30px"><a class="btn ghost" href="?mestre">🔐 Área do organizador</a></p>
   <p class="rod"><a href="?termos">Termos de uso e Privacidade</a></p></div>`;
  $('inF').onsubmit=e=>{ e.preventDefault(); const v=$('inC').value.trim().toLowerCase().replace(/.*[?&]f=/,'').replace(/[^a-z0-9-]/g,''); if(v) location.href=linkFesta(v); };
}

// =====================================================================
(async function iniciar(){
  if(!sb){ $('app').innerHTML='<div class="wrap center" style="padding-top:20vh"><h2>Sem conexão</h2><p>Recarregue a página.</p></div>'; return; }
  try{
    if(MODE==='convidado') await telaConvidado();
    else if(MODE==='telao') await telaTelao();
    else if(MODE==='admin') await telaAdmin();
    else if(MODE==='mestre') await telaMestre();
    else if(MODE==='termos') telaTermos();
    else telaInicio();
  }catch(e){ console.error(e); $('app').innerHTML='<div class="wrap center" style="padding-top:20vh"><h2>Ops!</h2><p>Não consegui carregar agora. Confira a internet e recarregue.</p></div>'; }
})();
</script>

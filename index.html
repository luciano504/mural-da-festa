<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mural da Festa</title>
<meta name="description" content="Fotos, recados, áudios e vídeos dos convidados no telão da festa — e um álbum de recordações no final.">
<meta property="og:title" content="Mural da Festa">
<meta property="og:description" content="Deixe sua homenagem: foto, recado, áudio ou vídeo!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%89%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;700&family=Rye&family=Space+Grotesk:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,50;1,9..144,300..500,50&family=Figtree:wght@400;500;600;700&family=Cinzel:wght@600;700&family=Fredoka:wght@400;500;600;700&family=Great+Vibes&family=Luckiest+Guy&family=Pacifico&family=Playfair+Display:wght@600;700&display=swap">
<style>
/* Layout: cada festa veste o próprio tema (tokens trocados por JS); página do convidado = capa + 4 botões + mural; telão = palco em tela cheia; anfitrião e mestre = painéis em abas */
:root{
  --bg:#fffdf7; --bg2:#f3e8ff; --surface:#ffffff; --ink:#2a1745; --muted:#6d5c86;
  --accent:#7b2cbf; --accent2:#ff9f1c; --on:#ffffff; --line:rgba(42,23,69,.12);
  --display:'Luckiest Guy', 'Fredoka', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif:'Fraunces', Georgia, serif;
  --hand:'Caveat', 'Fredoka', cursive;
  --ok:#2f9e44; --bad:#e03131; --warn:#f08c00;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%;overflow-x:hidden;
  background:radial-gradient(120% 70% at 50% -10%, var(--bg2) 0%, transparent 60%), var(--bg)}
[hidden]{display:none!important}
img,video{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
#bgimg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
#bgimg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--veu,.8)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--on);transition:transform .12s, filter .15s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
.btn.alt{background:var(--accent2);color:var(--on2,var(--ink))}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff} .btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.in, textarea.in, select.in{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 13px;min-width:0}
textarea.in{min-height:120px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--muted);min-width:0}
.msg{min-height:22px;font-weight:600;font-size:15px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%, transparent);color:var(--accent);font-weight:600;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
h2.sec{font-weight:700;font-size:22px;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.center{text-align:center}

/* ---------- capa do convidado ---------- */
.hero{padding:28px 20px 24px;text-align:center;position:relative;overflow:hidden}
.hero .who{font-family:var(--display);font-size:clamp(44px,11vw,96px);line-height:1.05;margin:10px 0 4px;color:var(--accent);text-wrap:balance;word-break:break-word}
.hero .tit{font-weight:700;font-size:clamp(18px,3.6vw,26px);margin:0;text-wrap:balance}
.hero .sub{font-weight:600;color:var(--accent2);font-size:clamp(16px,3vw,22px);margin-top:4px;filter:brightness(.85)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;color:var(--muted);font-weight:500;margin-top:14px}
.hero .msgf{max-width:620px;margin:14px auto 0;font-size:17px}
.hero .deco{position:absolute;font-size:44px;opacity:.9;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:640px){.acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;border-radius:22px;padding:20px 8px;cursor:pointer;font-weight:700;font-size:17px;
  background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.06);transition:transform .15s}
.act:hover{transform:translateY(-3px)} .act .ic{font-size:40px;line-height:1}
.act:nth-child(1){background:var(--accent);color:var(--on);border-color:transparent}
.act:nth-child(4){background:var(--accent2);color:var(--ink);border-color:transparent}
.namebar{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;justify-content:center}
.namebar .in{max-width:280px}
.closed{padding:16px;border-radius:18px;background:color-mix(in srgb,var(--accent2) 22%, var(--surface));font-weight:600;text-align:center;margin-top:16px}

/* ---------- mural ---------- */
.mural{columns:3 260px;column-gap:12px}
.post{break-inside:avoid;margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.05)}
.post img,.post video{display:block;width:100%;height:auto;background:#000}
.post .pb{padding:10px 14px 12px}
.post .by{font-weight:600;color:var(--muted);font-size:14px}
.post.t .pb{padding:18px 18px 14px}
.post.t blockquote{margin:0 0 8px;font-family:var(--hand);font-size:28px;line-height:1.15;word-break:break-word}
.post.a .pb{display:flex;flex-direction:column;gap:8px}
.post audio{width:100%}
.empty{column-span:all;padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:18px}

/* ---------- folha (envio) ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,8,20,.55);display:grid;place-items:center;backdrop-filter:blur(3px);
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:26px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .25s ease both}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sheet h3{margin:0 0 12px;font-size:24px;display:flex;align-items:center;gap:10px}
.sheet .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:3px dashed var(--line);border-radius:20px;padding:26px 12px;text-align:center;font-weight:600;cursor:pointer;background:var(--bg)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .ic{font-size:44px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugs button{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 10px;cursor:pointer;font-size:14px}
.rec{display:flex;flex-direction:column;align-items:center;gap:12px}
.rec .time{font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.rec canvas{width:100%;height:90px;border-radius:14px;background:var(--bg)}
.recbtn{width:92px;height:92px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 25%, transparent)}
.recbtn.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px color-mix(in srgb,var(--bad) 10%, transparent)}}
.vbox{position:relative;width:100%;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:60vh}
.vbox video{width:100%;height:100%;object-fit:cover;display:block}
.vbox .live{transform:scaleX(-1)}
.vbox .badge{position:absolute;top:10px;left:10px;background:var(--bad);color:#fff;border-radius:999px;padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.alt{font-size:14px;color:var(--muted);text-align:center}
.alt label{text-decoration:underline;cursor:pointer;position:relative}
.alt input{position:absolute;opacity:0;width:1px;height:1px}
.thanks{text-align:center;padding:10px 0}
.thanks .big{font-size:64px}

/* ---------- telão ---------- */
.tv{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:auto 1fr auto;color:var(--ink)}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 3vw 6px}
.tv-top .t{font-family:var(--display);font-size:clamp(28px,4vw,64px);color:var(--accent);line-height:1}
.tv-top .n{font-weight:700;font-size:clamp(16px,1.6vw,26px);color:var(--muted)}
.stage{position:relative;overflow:hidden;margin:0 3vw}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;animation:fadein .8s ease both}
@keyframes fadein{from{opacity:0;transform:scale(.98)}}
.sl.out{animation:fadeout .6s ease both}
@keyframes fadeout{to{opacity:0}}
.sl-foto .ph{max-width:100%;max-height:calc(100% - 11vh);min-height:0;object-fit:contain;border-radius:2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.35);border:1vh solid #fff;animation:kb 10s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.sl .cap{font-family:var(--hand);font-size:clamp(26px,3.4vw,58px);text-align:center;max-width:90%;line-height:1.1}
.sl .cap small{display:block;font-family:var(--body);font-weight:600;font-size:.45em;color:var(--muted);margin-top:.4em}
.sl-texto .q{font-family:var(--hand);text-align:center;max-width:88%;line-height:1.1;word-break:break-word}
.sl-texto .q::before{content:"“";display:block;font-family:var(--display);color:var(--accent);font-size:1.4em;line-height:.6}
.sl-texto .by{font-weight:700;font-size:clamp(20px,2.4vw,40px);color:var(--accent)}
.sl-video video{max-width:100%;max-height:calc(100% - 8vh);min-height:0;border-radius:2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.35);background:#000}
.eq{display:flex;align-items:flex-end;gap:1.2vh;height:28vh}
.eq i{width:3.2vh;border-radius:1.6vh;background:var(--accent);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2n){background:var(--accent2);animation-duration:.8s}
.eq i:nth-child(3n){animation-duration:1.25s}
@keyframes eq{0%,100%{height:15%}50%{height:100%}}
.sl-audio .mic{font-size:12vh}
.tv-bar{display:flex;align-items:center;gap:2vw;padding:1.2vh 3vw 2.2vh}
body.sem-qr .tv-bar{display:none}
.tv-bar .qr{background:#fff;padding:1vh;border-radius:1.4vh;line-height:0}
.tv-bar .qr{width:17vh;flex:none}
.tv-bar b{display:block;font-size:clamp(20px,2.6vw,44px);font-family:var(--display);color:var(--accent)}
.tv-bar span{font-weight:600;font-size:clamp(14px,1.5vw,24px);color:var(--muted)}
.tv-bar .acts-mini{margin-left:auto;font-size:clamp(28px,3.4vw,56px);letter-spacing:.2em}
.tv-start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:color-mix(in srgb,var(--bg) 88%, transparent);padding:16px}
.tv-start .who{font-family:var(--display);font-size:clamp(48px,9vw,140px);color:var(--accent);line-height:1}
.tv-empty{display:flex;flex-direction:column;align-items:center;gap:3vh;text-align:center}
.tv-empty .qr{background:#fff;padding:2vh;border-radius:2vh;line-height:0}
.tv-empty .qr{width:40vh}
.stage .sl.tv-empty{z-index:3}
.tv-empty h2{font-family:var(--display);color:var(--accent);font-size:clamp(32px,5vw,80px);margin:0;font-weight:400}
.tv-empty p{font-size:clamp(18px,2vw,32px);font-weight:600;margin:0;color:var(--muted)}
.chars{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.ch{position:absolute;line-height:0}
.ch img{height:min(30vh,30vw);width:auto;max-width:40vw;object-fit:contain;filter:drop-shadow(0 1.5vh 2.5vh rgba(0,0,0,.35))}
.ch img.sticker{height:min(26vh,26vw);background:#fff;padding:.9vh;border-radius:2.2vh;transform:rotate(var(--r));box-shadow:0 1.6vh 3.5vh rgba(0,0,0,.35);filter:none}
.ch .emo{font-size:min(20vh,24vw);line-height:1;filter:drop-shadow(0 1vh 2vh rgba(0,0,0,.25))}
.ch.pk-l{left:1vw;bottom:calc(var(--bh,22vh) + 1vh);animation:pkl 6.5s cubic-bezier(.3,1.3,.5,1) both}
.ch.pk-r{right:1vw;bottom:calc(var(--bh,22vh) + 1vh);animation:pkr 6.5s cubic-bezier(.3,1.3,.5,1) both}
.ch.pk-b{left:50%;bottom:calc(var(--bh,22vh) + 1vh);animation:pkb 6.5s ease both}
.ch.voa{top:10vh;left:0;animation:voa 7s linear both}
.ch.pula{left:6vw;bottom:calc(var(--bh,22vh) + 1vh);animation:pula 6.5s ease-in-out both}
@keyframes pkl{0%{transform:translateX(-130%) rotate(-25deg)}14%{transform:translateX(0) rotate(10deg)}22%{transform:rotate(-7deg)}32%{transform:rotate(5deg)}45%{transform:translateY(-3vh) rotate(-3deg)}58%{transform:translateY(0) rotate(4deg)}84%{transform:translateX(0) rotate(0)}100%{transform:translateX(-140%) rotate(-20deg)}}
@keyframes pkr{0%{transform:translateX(130%) rotate(25deg)}14%{transform:translateX(0) rotate(-10deg)}22%{transform:rotate(7deg)}32%{transform:rotate(-5deg)}45%{transform:translateY(-3vh) rotate(3deg)}58%{transform:translateY(0) rotate(-4deg)}84%{transform:translateX(0) rotate(0)}100%{transform:translateX(140%) rotate(20deg)}}
@keyframes pkb{0%{transform:translate(-50%,110%)}16%{transform:translate(-50%,-6%) scale(1.05)}24%{transform:translate(-50%,2%) scale(.97)}32%,78%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4%) rotate(4deg)}64%{transform:translate(-50%,0) rotate(-4deg)}100%{transform:translate(-50%,115%)}}
@keyframes voa{0%{transform:translate(-45vw,0) rotate(-8deg)}25%{transform:translate(20vw,-4vh) rotate(6deg)}50%{transform:translate(50vw,3vh) rotate(-6deg)}75%{transform:translate(80vw,-4vh) rotate(6deg)}100%{transform:translate(115vw,0) rotate(-8deg)}}
@keyframes pula{0%{transform:translate(-50vw,0)}12%{transform:translate(0,0)}20%{transform:translate(0,-10vh) rotate(-8deg)}28%{transform:translate(0,0) scale(1.05,.93)}36%{transform:translate(0,-6vh) rotate(8deg)}44%{transform:translate(0,0)}52%{transform:translate(0,-3vh)}60%,82%{transform:translate(0,0)}100%{transform:translate(-55vw,0)}}
.conf{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.conf i{position:absolute;top:-4vh;width:1.5vh;height:.9vh;border-radius:2px;animation:cf 3s ease-in both}
@keyframes cf{to{transform:translate(var(--x),112vh) rotate(var(--g))}}
.sl.e-zoom{animation:ezoom .9s cubic-bezier(.3,1.4,.5,1) both}
.sl.e-calma{animation:ecalma .7s ease-out both}
@keyframes ecalma{from{opacity:0;transform:translateY(1.2vh)}to{opacity:1;transform:none}}
.sl-intro.quieto .nm{color:var(--ink);text-shadow:none;font-size:clamp(48px,7.5vw,128px);line-height:1.05;max-width:86vw;margin:0 auto}
.sl-intro.quieto .nm span{animation:none}
.sl-intro.quieto .hey{font-size:clamp(16px,1.8vw,30px);letter-spacing:.14em;text-transform:uppercase}
.sl.e-left{animation:eleft .8s cubic-bezier(.3,1.2,.5,1) both}
.sl.e-right{animation:eright .8s cubic-bezier(.3,1.2,.5,1) both}
.sl.e-up{animation:eup .8s cubic-bezier(.3,1.2,.5,1) both}
.sl.e-tilt{animation:etilt .9s cubic-bezier(.3,1.3,.5,1) both}
@keyframes ezoom{from{opacity:0;transform:scale(.6)}}
@keyframes eleft{from{opacity:0;transform:translateX(-40vw) rotate(-6deg)}}
@keyframes eright{from{opacity:0;transform:translateX(40vw) rotate(6deg)}}
@keyframes eup{from{opacity:0;transform:translateY(30vh)}}
@keyframes etilt{from{opacity:0;transform:rotate(-14deg) scale(.8)}}
.sl.out{animation:fadeout .6s ease both !important}
.sl-foto .ph{transform:rotate(var(--r,0deg))}
.pol{background:#fff;padding:1.2vh 1.2vh 1.2vh;border-radius:.8vh;box-shadow:0 2vh 6vh rgba(0,0,0,.38);transform:rotate(var(--r));max-width:92%;line-height:0;overflow:hidden;animation:polin .9s cubic-bezier(.3,1.5,.5,1) both}
.pol img{max-height:calc(var(--sh,60vh) - 13vh);max-width:86vw;object-fit:contain;display:block;animation:kb 7s ease-out both}
@keyframes polin{from{opacity:0;transform:rotate(calc(var(--r) * 3)) scale(.5) translateY(-20vh)}}
.sl-col{display:block}
.sl-col .pol{position:absolute;max-width:44%}
.sl-col .pol img{max-height:calc(var(--sh,60vh) * .52);max-width:40vw}
.sl-col .c1{left:4%;top:6%} .sl-col .c2{left:30%;top:24%;z-index:2} .sl-col .c3{right:4%;top:2%}
.sl-col .cap{position:absolute;left:0;right:0;bottom:1vh;margin:auto}
.sl-intro{text-align:center}
.sl-intro .hey{font-weight:700;font-size:clamp(18px,2.6vw,42px);color:var(--muted)}
.sl-intro .nm{font-family:var(--display);color:var(--accent);font-size:clamp(44px,min(11vw,14vh),190px);line-height:1;text-shadow:0 .6vh 0 color-mix(in srgb,var(--accent2) 60%, transparent)}
.sl-intro .nm span{display:inline-block;animation:onda 1.6s ease-in-out infinite}
@keyframes onda{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3vh) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.sl-intro .sub{font-weight:700;font-size:clamp(22px,3.4vw,56px);color:var(--ink)}
.sl-intro .cta{font-weight:600;font-size:clamp(15px,1.8vw,30px);color:var(--muted);background:color-mix(in srgb,var(--surface) 80%, transparent);padding:1.2vh 2.4vw;border-radius:99px}
.novo{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:3;background:var(--accent);color:var(--on);font-weight:800;font-size:clamp(16px,2.2vw,36px);padding:.8vh 2.4vw;border-radius:99px;box-shadow:0 1vh 3vh rgba(0,0,0,.25);animation:novo 1s ease-in-out infinite alternate}
@keyframes novo{to{transform:translateX(-50%) scale(1.08)}}
.tv-empty .qr{width:min(calc(var(--sh,60vh) - 22vh),62vw)}
.sl-foto .ph{max-height:calc(var(--sh,60vh) - 12vh) !important;max-width:88vw !important}
.sl-video video{max-height:calc(var(--sh,60vh) - 7vh) !important}
.tv-hint{position:fixed;right:12px;bottom:8px;z-index:6;font-size:12px;color:var(--muted);opacity:.5}

/* ---------- painéis ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;font-size:clamp(22px,4vw,32px)}
.top h1 em{font-style:normal;font-family:var(--display);color:var(--accent);font-weight:400}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tabs button{border:0;border-radius:999px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:transparent}
.tabs .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;line-height:20px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{display:flex;flex-direction:column;overflow:hidden}
.mod .media img,.mod .media video{display:block;width:100%;max-height:300px;object-fit:cover;background:#000}
.mod .media audio{width:100%;margin-top:10px}
.mod .media blockquote{margin:0;padding:16px;font-family:var(--hand);font-size:24px;line-height:1.15;word-break:break-word;background:var(--bg)}
.mod .info{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);font-weight:500}
.mod .acts2{display:flex;gap:8px;padding:0 12px 12px}
.mod .acts2 .btn{flex:1}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg)}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tema{position:relative;border:3px solid transparent;border-radius:18px;padding:12px;cursor:pointer;text-align:left;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.tema[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface) inset}
.tema .e{font-size:30px}
.tema .nm{font-weight:700;font-size:15px}
.tema .dots{display:flex;gap:4px}
.tema .dots i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.tema.seu{background:linear-gradient(135deg,#fff 0%,#fff6e0 100%);color:#2b2335;border:3px dashed var(--accent);grid-column:span 2;min-height:110px}
.tema.seu[aria-pressed="true"]{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%, transparent)}
.tema.seu .nm{font-size:19px} .tema.seu small{font-size:13px;color:#6b6478;font-weight:600}
.seucta{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 20px;margin-bottom:12px;border:3px solid var(--accent);background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--accent) 12%, var(--surface)))}
.seucta h2{margin:0;font-size:24px} .seucta p{margin:4px 0 0;color:var(--muted)}
.tema .rec{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.85);color:#333}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cat{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 8px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat .e{font-size:30px}
.cat[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%, var(--surface))}
.fest{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.fest h3{margin:0;font-size:18px}
.fest .meta{font-size:14px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.fest .stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fest .acts3{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.fest{grid-template-columns:1fr}.fest .acts3{justify-content:flex-start}}
.linkbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px}
.linkbox code{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:12px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.qrbig{background:#fff;padding:12px;border-radius:16px;display:inline-block;line-height:0;width:224px;max-width:100%}
.landing .hero{padding:44px 20px 30px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.step{padding:18px}
.step .e{font-size:38px}
.step h3{margin:6px 0 4px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.enf{position:absolute;pointer-events:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.18));animation:bob 5s ease-in-out infinite}
.hero .enf.e1{right:-8px;top:-8px;width:min(20%,140px)} .hero .enf.e2{left:-10px;bottom:-10px;width:min(15%,100px);transform:scaleX(-1);animation-delay:-2s}
.hero.tem-enf{padding-left:12%;padding-right:12%}
.tv-enf{height:24vh;width:auto;margin-left:auto;align-self:flex-end;filter:drop-shadow(0 1vh 2vh rgba(0,0,0,.25));animation:bob 5s ease-in-out infinite}
.tv-start .enf-big{max-height:34vh;max-width:70vw;display:block;margin:0 auto 10px}
.sl-texto .q.card-on{background:color-mix(in srgb,var(--surface) 88%, transparent);padding:3vh 4vw;border-radius:3vh}
.up2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.upbox{border:3px dashed var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:var(--bg);position:relative}
.upbox .pv{width:100%;height:170px;border-radius:12px;background:#eee center/contain no-repeat;display:grid;place-items:center;color:var(--muted);font-weight:600}
.upbox .pv.xadrez{background-color:#fff;background-image:linear-gradient(45deg,#e9e9ef 25%,transparent 25%),linear-gradient(-45deg,#e9e9ef 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9e9ef 75%),linear-gradient(-45deg,transparent 75%,#e9e9ef 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.upbox .pv{overflow:hidden;position:relative}
.upbox .pv img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;display:block}
.cores{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.cores label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.cores input[type=color]{width:56px;height:44px;border:2px solid var(--line);border-radius:12px;padding:2px;background:var(--surface);cursor:pointer}
.decl{border:2px solid var(--accent);border-radius:16px;padding:14px;background:color-mix(in srgb,var(--accent) 7%, var(--surface))}
.decl p{margin:0 0 10px;font-size:14px}
.kitsec{border-top:2px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.kitsec h4{margin:0;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kitsec .dica{margin:0;font-size:14px;color:var(--muted)}
.kitguia{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kitguia div{background:color-mix(in srgb,var(--accent) 9%, var(--surface));border-radius:14px;padding:10px 12px;font-size:14px}
.kitguia b{display:block;font-size:20px;color:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#f1f1f5;border:2px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.png{background-color:#fff;background-image:linear-gradient(45deg,#ececf2 25%,transparent 25%),linear-gradient(-45deg,#ececf2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ececf2 75%),linear-gradient(-45deg,transparent 75%,#ececf2 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.thumb.png img{object-fit:contain;padding:6px}
.thumb .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-weight:700;cursor:pointer;line-height:28px;padding:0}
.thumb .n1{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:2px 6px}
.thumb.add{display:grid;place-items:center;border:3px dashed var(--line);cursor:pointer;font-weight:700;color:var(--muted);text-align:center;font-size:13px;background:var(--bg);padding:6px}
.thumb.add span{font-size:30px;display:block}
.thumb.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.kpill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:#fff3bf;color:#6b5000}
.kpill.ok{background:#d3f9d8;color:#1b5e20}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{position:relative;border:3px solid var(--line);border-radius:16px;padding:12px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px;min-height:84px}
.opt[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%, var(--surface))}
.opt .e{font-size:26px}
.opt b{font-size:15px}
.opt small{color:var(--muted);font-size:12px}
.opt .play{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--on);font-size:15px;cursor:pointer}
.faixas{display:flex;flex-direction:column;gap:8px}
.faixa{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--surface)}
.faixa .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.faixa audio{height:34px;max-width:46%}
.hist{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 16px;-webkit-overflow-scrolling:touch}
.hist figure{margin:0;flex:none;background:#fff;padding:7px 7px 26px;border-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.18);scroll-snap-align:start}
.hist figure:nth-child(odd){transform:rotate(-1.5deg)} .hist figure:nth-child(even){transform:rotate(1.5deg)}
.hist img{height:190px;width:auto;max-width:72vw;display:block;object-fit:cover;border-radius:2px}
.tv-bar .qr{position:relative;z-index:3}
.demo{position:fixed;left:0;top:0;z-index:2;pointer-events:none;background:rgba(20,16,24,.55);color:#fff;font:700 clamp(12px,1.25vw,20px)/1.2 Figtree,Fredoka,sans-serif;text-align:center;padding:.7vh 1.2vw;border-radius:99px;backdrop-filter:blur(4px);box-shadow:0 .6vh 2vh rgba(0,0,0,.18);will-change:transform;opacity:.85}
.demo small{font-weight:500;opacity:.85}
.demo-faixa{position:fixed;left:50%;transform:translateX(-50%);top:8px;z-index:10;width:max-content;max-width:calc(100% - 32px);background:color-mix(in srgb,var(--surface) 88%, transparent);color:var(--muted);border:1px solid var(--line);border-radius:99px;text-align:center;font:600 12.5px/1.3 Figtree,sans-serif;padding:5px 12px;backdrop-filter:blur(6px)}
.planos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px;padding-top:12px}
.plano{position:relative;border:3px solid var(--line);border-radius:20px;padding:16px;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;gap:8px}
.plano.dest{border-color:var(--accent);box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 22%, transparent)}
.plano .tag{position:absolute;top:-12px;right:14px;background:var(--accent);color:var(--on);font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.plano .e{font-size:34px;line-height:1}
.plano h4{margin:0;font-size:21px}
.plano .p{font-size:30px;font-weight:800;color:var(--accent);line-height:1}
.plano .p small{font-size:13px;color:var(--muted);font-weight:600}
.plano ul{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.plano .d{margin:0;color:var(--muted);font-size:14px}
.plano .btn{margin-top:auto}
.plano-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;background:#d3f9d8;color:#1b5e20;margin-bottom:12px}
.teste-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;background:#fff3bf;color:#5c4400;margin-bottom:12px}
.teste-bar b{font-size:16px}
.passos{padding:16px 18px;margin-bottom:12px;border:3px solid var(--accent)}
.passos ol{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.passos button.link{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--accent);text-decoration:underline;cursor:pointer}
.aviso{padding:12px 14px;border-radius:14px;background:#fff3bf;color:#5c4400;font-weight:600}
.legal{max-width:780px}
.legal h2{font-size:20px;margin:26px 0 8px}
.legal p,.legal li{font-size:16px;line-height:1.6}
.nota{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
.nota a,.rod a{color:var(--accent)}
.rod{text-align:center;margin-top:30px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* =================== acabamento: lembrança, não panfleto =================== */
body{font-size:16.5px;line-height:1.55;letter-spacing:.003em;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:450;letter-spacing:-.01em;font-variation-settings:"SOFT" 50}
h2.sec{font-family:var(--serif);font-weight:420;font-size:clamp(24px,4vw,30px);margin:44px 0 14px;gap:12px}
h2.sec .muted{font-family:var(--body)}
.card{border-radius:24px;box-shadow:0 1px 2px rgba(30,20,40,.04),0 12px 32px -18px rgba(30,20,40,.18)}
.btn{font-weight:600;letter-spacing:.01em;padding:12px 20px;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 70%, transparent)}
.btn.ghost{border-width:1px;box-shadow:none;background:color-mix(in srgb,var(--surface) 70%, transparent)}
.btn.alt{box-shadow:none}
.btn.sm{padding:8px 14px}
.in, textarea.in, select.in{border-width:1px;border-radius:12px;background:var(--surface);transition:border-color .15s, box-shadow .15s}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%, transparent)}
.chip{font-weight:600;background:transparent;border:1px solid color-mix(in srgb,var(--accent) 35%, transparent)}
.ic svg{width:1em;height:1em;display:block}
.tabs{gap:4px;padding:4px;background:color-mix(in srgb,var(--surface) 75%, transparent);border:1px solid var(--line);border-radius:999px;width:fit-content;max-width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.tabs button{border:0;background:transparent;white-space:nowrap;padding:9px 16px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on);box-shadow:0 4px 12px -6px var(--accent)}
.sheet{border-radius:28px;padding:24px}
.sheet h3{font-size:26px}

/* ---- página do convidado: um convite, não um site ---- */
.convite{max-width:760px}
.capa{position:relative;text-align:center;padding:36px 8px 8px}
.arco{width:min(220px,56vw);aspect-ratio:4/5;margin:0 auto 22px;border-radius:999px 999px 26px 26px;overflow:hidden;padding:7px;background:var(--surface);
  box-shadow:0 18px 40px -22px rgba(30,20,40,.45), 0 0 0 1px var(--line);animation:arcoIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.arco img{width:100%;height:100%;object-fit:cover;border-radius:999px 999px 20px 20px;display:block}
@keyframes arcoIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.capa .enfc{position:absolute;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18));animation:bob 6s ease-in-out infinite}
.capa .enfc.l{left:-2%;top:18%;width:min(22%,150px)} .capa .enfc.r{right:-2%;top:30%;width:min(20%,130px);animation-delay:-3s}
.capa .enfc.sticker{background:#fff;padding:5px;border-radius:14px;transform:rotate(-5deg)}
.capa .enfc.r.sticker{transform:rotate(6deg)}
.capa .lead{font-family:var(--serif);font-style:italic;font-weight:350;color:var(--muted);font-size:clamp(17px,2.6vw,21px);margin:0}
.capa .who{font-family:var(--display);color:var(--accent);font-size:clamp(52px,13vw,112px);line-height:.98;margin:6px 0 10px;text-wrap:balance;word-break:break-word}
.capa .tit{font-family:var(--serif);font-weight:400;font-size:clamp(18px,3vw,22px);margin:0 0 4px;text-wrap:balance}
.capa .quando{color:var(--muted);font-size:16px;margin:12px 0 0;line-height:1.5}
.capa .quando b{color:var(--ink);font-weight:600}
.capa .msgf{font-family:var(--hand);font-size:clamp(24px,4.4vw,30px);line-height:1.2;max-width:560px;margin:22px auto 0;color:var(--ink)}
.capa .fio{width:56px;height:1px;background:var(--accent);opacity:.5;margin:26px auto 0}
.deixe{text-align:center}
.deixe .sub{color:var(--muted);margin:-6px auto 18px;max-width:460px}
.acts{gap:10px;margin-top:0}
.act{border:1px solid var(--line);border-radius:20px;padding:20px 10px 16px;font-weight:600;font-size:16px;box-shadow:none;background:var(--surface);color:var(--ink);gap:10px}
.act .ic{font-size:30px;color:var(--accent)}
.act small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:-4px}
.act:nth-child(1){background:var(--accent);color:var(--on)} .act:nth-child(1) .ic,.act:nth-child(1) small{color:var(--on)} .act:nth-child(1) small{opacity:.85}
.act:nth-child(4){background:var(--surface);color:var(--ink)}
.act:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%, var(--line))}
.namebar{margin-top:18px}
.namebar .in{max-width:300px;text-align:center}
.nota{font-size:14px;color:var(--muted);margin:10px 0 0}
.hist{padding:10px 6px 20px;gap:16px}
.hist figure{border-radius:4px;padding:8px 8px 30px;box-shadow:0 14px 30px -18px rgba(30,20,40,.5)}
.post{border-radius:16px;box-shadow:0 10px 26px -20px rgba(30,20,40,.45)}
.post.t{background:color-mix(in srgb,var(--surface) 88%, var(--accent2) 12%);border-color:transparent;border-radius:6px 16px 16px 16px}
.post.t blockquote{font-size:30px}
.post .by{font-weight:500}
.empty{border:1px dashed var(--line);font-size:15px}
.rod{color:var(--muted);font-size:13px;text-align:center;margin-top:40px}

/* ---- página inicial ---- */
.lgratis{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--surface);border:1.5px dashed var(--accent);border-radius:24px;padding:20px 22px;margin:8px 0 10px}
.lgratis .lg-e{font-size:40px;line-height:1}
.lgratis .lg-t{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px}
.lgratis .lg-t b{font-family:var(--serif);font-weight:450;font-size:22px}
.lgratis .lg-t span{color:var(--muted);font-size:15px}
.plano.gratis{border-style:dashed;background:color-mix(in srgb,var(--surface) 70%, var(--bg))}
.plano.gratis .tag{background:var(--ink)}
.plano .p small{white-space:nowrap}

.lperfis{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:18px}
.lperfis span{color:var(--muted);font-size:14px;margin-right:2px}
.lperfis button{font:inherit;font-size:14.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;transition:background .2s,color .2s}
.lperfis button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.lmais{margin:18px 0 0;color:var(--muted);font-size:15px;border-left:3px solid var(--accent2);padding-left:12px}

.chip.on{background:#d3f9d8;color:#1b5e20} .chip.off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.ev-c .row{gap:6px}

/* =====================================================================
   DESIGN SYSTEM Mural da Festa (camada final: vale para todos os temas)
   2 famílias (display do tema só no nome do evento), borda em vez de sombra,
   botões 44px, raio 10/16, ações sem cores misturadas
   ===================================================================== */
:root{ --hand:'Figtree', system-ui, sans-serif; --r-sm:6px; --r-md:10px; --r-lg:16px; }
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.card{border-radius:var(--r-lg);box-shadow:none;border:1px solid var(--line)}
.btn{border-radius:var(--r-md);min-height:44px;padding:10px 18px;font-weight:700;letter-spacing:.01em;box-shadow:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.big{min-height:52px;font-size:17px}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}
.btn.ghost:hover{border-color:color-mix(in srgb,var(--ink) 30%, transparent);filter:none}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.in:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in, textarea.in, select.in{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);min-height:44px}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%, transparent);outline:none}
label.f{color:var(--ink);font-weight:600}
.chip{border-radius:var(--r-sm)}
h2.sec{font-family:var(--body);font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.01em}
.card h3{font-family:var(--body);font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted)}
/* ações do convidado: todas iguais, ícone na cor do tema */
.act{border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:none;font-size:16px;align-items:flex-start;text-align:left;padding:16px}
.act:nth-child(1),.act:nth-child(4){background:var(--surface);color:var(--ink);border-color:var(--line)}
.act:hover{transform:none;border-color:var(--accent)}
.act .ic{color:var(--accent)}
.act small{font-weight:500;color:var(--muted)}
/* mural */
.post{border-radius:var(--r-lg);box-shadow:none}
.post.t blockquote,.mod .media blockquote{font-family:var(--body);font-size:19px;line-height:1.35;font-weight:500}
/* abas do painel */
#abasTop{border-radius:var(--r-lg);box-shadow:none}
#abasTop button{border-radius:var(--r-md);font-weight:600}
#abasTop button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 12%, var(--surface));color:var(--accent);box-shadow:none}
/* telão: mensagens e legendas em letra reta */
.sl .cap,.sl-texto .q{font-family:var(--body);font-weight:500;letter-spacing:-.01em}
.sl-texto .q::before{display:none}
.tv-bar{border-top:1px solid var(--line)}
.tv-bar b{font-family:var(--body);font-weight:700}
.tv-empty h2{font-family:var(--body);font-weight:700}
/* sóbrio (empresa): sem enfeites */
body.corp .hero .deco, body.corp .deco{display:none}
.plano-bar{background:color-mix(in srgb,#15803d 8%, var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,#15803d 25%, var(--line));border-radius:var(--r-lg)}
.plano-bar b{color:#15803d}

/* painel do organizador: menu lateral no computador e números do momento */
@media (min-width:1100px){
  .adm-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
  .adm-grid #abasTop{position:sticky;top:12px;flex-direction:column;align-items:stretch;width:auto;border-radius:var(--r-lg);padding:6px;margin:0;overflow:visible;background:var(--surface)}
  .adm-grid #abasTop button{text-align:left;padding:10px 12px;border-radius:var(--r-md);white-space:normal}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.kpis:empty{display:none}
.kpi{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);text-align:left;font:inherit}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--accent)}
.kpi .kt{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .kv{font-size:32px;line-height:36px;font-weight:700} .kpi .kv small{font-size:17px;font-weight:500;color:var(--muted)}
.kpi .kb{display:block;height:6px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%, transparent);overflow:hidden} .kpi .kb i{display:block;height:100%;background:var(--accent)}
.kpi .kd{font-size:13px;color:var(--muted)} .kpi .warn{color:#b45309}

/* telas da equipe no mesmo padrão: cozinha, recepção e manobrista */
.ped-board{gap:16px}
.ped-col{background:color-mix(in srgb,var(--ink) 3%, transparent);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px}
.ped-col h3{display:flex;align-items:center;gap:8px;font-family:var(--body);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:2px 4px 12px}
.ped-col h3 .muted{margin-left:auto;font-size:13px;letter-spacing:0;text-transform:none}
.ped-col h3 #cN:not(:empty),.ped-col h3 #cP:not(:empty){background:var(--accent);color:var(--on,#fff);border-radius:999px;padding:1px 9px}
.ped{box-shadow:none;border-radius:var(--r-lg);padding:14px 16px;position:relative;overflow:hidden}
.ped.ped-novo{border:1px solid var(--accent);animation:pedNovo 1.2s ease 2}
.ped.ped-novo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.ped .m{font-family:var(--body);font-weight:800;font-size:40px;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.ped ul{list-style:none;padding:0;margin:10px 0;font-size:17px}

.port-cont{font-family:var(--body);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.port-lista button{border-radius:var(--r-md);padding:10px 12px}

.vl-card{border-radius:var(--r-md);padding:12px 14px}

/* logomarca, aviso fixado, contagem e desafios */
.tv-start{z-index:50} .ds-top h2.sec{justify-content:flex-start;text-align:left}
body.com-aviso .tv-top{margin-top:5.5vh}
.capa-logo{display:block;max-height:76px;max-width:220px;margin:0 auto 12px;object-fit:contain}
.tv-logo{height:1em;max-width:16vw;object-fit:contain;vertical-align:middle;margin-right:.35em}
.mk-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}

@media (max-width:520px){.mk-row{flex-direction:column}}

.aviso-fix{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent);color:var(--on);font-weight:600}
.aviso-fix.cont{justify-content:space-between;background:var(--surface);color:var(--ink);border:1px solid var(--line)} .aviso-fix.cont b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
.tv-aviso{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;gap:1vw;padding:1.2vh 3vw;background:var(--accent);color:var(--on);font-weight:600;font-size:clamp(16px,1.7vw,30px);box-shadow:0 6px 20px -12px rgba(0,0,0,.5)}
.tv-cont{position:fixed;inset:0;z-index:35;display:grid;place-items:center;text-align:center;background:var(--bg);color:var(--ink)}
.tv-cont .cl{max-height:12vh;max-width:30vw;object-fit:contain;display:block;margin:0 auto 4vh}

.tv-cont .cn span{display:flex;flex-direction:column;align-items:center} .tv-cont .cn b{font-size:clamp(80px,14vw,260px);line-height:1;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.tv-cont .cn small{font-size:clamp(14px,1.4vw,24px);color:var(--muted)} .tv-cont .cn i{font-style:normal;font-size:clamp(60px,10vw,190px);line-height:1.1;color:var(--accent)}
.tv-cont .cn b.ja{font-size:clamp(60px,9vw,170px);color:var(--accent)}
.tv-cont .cw{font-family:var(--display);font-size:clamp(22px,2.6vw,48px);color:var(--accent)}
.ds-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ds-n{flex:none;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%, transparent);color:var(--accent);font-size:13px;font-weight:700}
.ds-bar{height:8px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%, transparent);margin:12px 0;overflow:hidden} .ds-bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.ds-l{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.ds-l li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)} .ds-l li:first-child{border-top:0}
.ds-c{flex:none;width:26px;height:26px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800}
.ds-l li.ok .ds-c{background:#15803D;border-color:#15803D;color:#fff} .ds-l li.ok .ds-t{color:var(--muted);text-decoration:line-through}
.ds-t{flex:1;text-align:left} .ds-fim{margin:10px 0 0;font-weight:700;color:#15803D;text-align:center}

.mol-fmt button{height:42px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.mol-fmt button[aria-checked=true]{border:2px solid var(--accent);color:var(--accent)}

/* fotos de festas reais na página inicial */
.lfotos{margin:8px 0 8px}
.lf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

/* bingo */

.bc-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:12px}
.bc{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.bc-h,.bc-g{display:grid;grid-template-columns:repeat(5,1fr)}

.bc-g span{aspect-ratio:1;display:grid;place-items:center;font-weight:700;font-size:18px;border-top:1px solid var(--line);border-left:1px solid var(--line);font-variant-numeric:tabular-nums;position:relative}

/* telão sóbrio: batizado, crisma, minimalista, corporativo */
body.tv-quieto .chars{display:none}
body.tv-quieto #fx{opacity:.18}
body.tv-quieto .tv-top .n{white-space:nowrap}
body.tv-quieto .sl-intro.quieto .nm{color:var(--accent);font-weight:500}
body.tv-quieto .sl-intro.quieto .sub{letter-spacing:.06em}
body.tv-quieto .sl-intro .cta{background:transparent;box-shadow:none;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-weight:500}
body.tv-quieto .novo{background:var(--surface,#fff);color:var(--accent);box-shadow:none;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
@media (orientation:portrait){ .tv-top .t{font-size:clamp(22px,6vw,48px)} .tv-top{align-items:flex-start} .sl-intro.quieto .nm{font-size:clamp(40px,11vw,96px)} }

.mic .emi{width:1em;height:1em;color:var(--accent);stroke-width:1.6}
.tv .emi,.stage .emi{stroke-width:1.7}

body.tv-serif .sl-texto .q, body.tv-serif .sl-correio .q{font-family:'Cormorant Garamond','Playfair Display',Georgia,serif;font-weight:600;letter-spacing:0}
.conf i{opacity:.8}

body.tv-quieto .sl-intro.quieto .nm{font-size:clamp(40px,min(9vw,11vh),160px);line-height:1.08}
.sl-texto .q,.sl-correio .q{text-wrap:balance}

.orn{position:fixed;z-index:4;width:min(26vh,22vw);aspect-ratio:1;bottom:17vh;color:var(--accent);opacity:.2;pointer-events:none}
.orn svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.orn-a{left:1.5vw} .orn-b{right:1.5vw;transform:scaleX(-1)}
body.tv-trop{background:linear-gradient(180deg,#ffe8d6 0%,#fff4e6 45%,#fffdf5 100%) fixed}
@media (orientation:portrait){ .orn{width:26vw;bottom:24vh;opacity:.14} }

/* QR do telão: discreto, grande em momentos, some quando não cabe */
body.qr-mini .tv-bar{padding:.8vh 3vw 1.2vh;gap:1.4vw}
body.qr-mini .tv-bar .qr{width:10vh;padding:.6vh;border-radius:1vh}
body.qr-mini .tv-bar b{font-size:clamp(16px,1.8vw,30px)}
body.qr-mini .tv-bar span{font-size:clamp(12px,1.1vw,18px)}
body.qr-grande .tv-bar .qr{width:22vh}
.tv-bar,.tv-bar .qr{transition:width .6s ease, padding .6s ease}
body.qr-off-auto .tv-bar{display:none}
.tvb-r{display:flex;gap:6px;flex-wrap:wrap}
.tvb-r .btn.off{background:#7f1d1d;border-color:#7f1d1d;color:#fff}

/* sem informação repetida: na abertura o nome só aparece grande; na tela do QR grande, o rodapé some */
.tv-nome{transition:opacity .5s}
.tv:has(.sl-intro) .tv-top .tv-nome{opacity:0}
.tv:has(#tvQrBig) .tv-bar{visibility:hidden}

.sl-intro .intro-arte{display:block;margin:0 auto 2vh;max-height:32vh;max-width:44vw;object-fit:contain;border-radius:1.2vh;mix-blend-mode:multiply}
.tv:has(.sl-intro .intro-arte) .tv-top .tv-logo{opacity:0}
.tv:has(.sl-intro .intro-arte) .sl-intro.quieto .nm{font-size:clamp(36px,min(7.5vw,9vh),140px)}

/* fotos ocupam o palco (antes podiam ficar minúsculas) */
.sl-foto .ph{height:calc(var(--sh,60vh) - 14vh);width:auto;max-width:88vw !important}
.sl{overflow:hidden;justify-content:safe center}

/* várias fotos ao mesmo tempo */
.sl-grade .grd{display:grid;gap:1.6vw;width:100%;height:calc(var(--sh,60vh) - 3vh);max-height:100%;padding:0 1vw}
.sl-grade.n2 .grd{grid-template-columns:repeat(2,1fr)}
.sl-grade.n3 .grd{grid-template-columns:repeat(3,1fr)}
.sl-grade figure{margin:0;min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fadein .8s ease both}
.sl-grade img{max-width:100%;max-height:calc(100% - 4.5vh);min-height:0;object-fit:contain;border:.8vh solid #fff;border-radius:1.4vh;box-shadow:0 1.5vh 4vh rgba(0,0,0,.25)}
.sl-grade figcaption{margin-top:.8vh;font-weight:600;font-size:clamp(14px,1.5vw,26px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (orientation:portrait){ .sl-grade.n2 .grd{grid-template-columns:1fr;grid-template-rows:repeat(2,1fr)} .sl-grade.n3 .grd{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)} }
</style>

function motorArquivos(faixas){

      ${(x.fotos||[]).length?`<div class="vl-fotos">${x.fotos.map(p=>`<a href="${midia(p)}" target="_blank" rel="noopener"><img src="${midia(p)}" alt="" loading="lazy"></a>`).join('')}</div>`:''}${x.obs?`<p class="muted">“${esc(x.obs)}”</p>`:''}</div>
      <div class="msg" id="eMsg"></div><div class="foot" style="flex-wrap:wrap"><button class="btn ghost" id="eCancel">Fechar</button><button class="btn ghost" id="vEd">✏️ Editar</button>${x.status==='estacionado'?`<button class="btn" id="vPede">🔔 Convidado pediu no balcão</button>`:''}${x.status==='entregue'?`<button class="btn ghost" id="vVolta">↩ Voltou a estacionar</button>`:''}</div>`);
    $('eCancel').onclick=fecharFolha; $('vEd').onclick=()=>registrar(x.token, x);
    if($('vPede')) $('vPede').onclick=async()=>{ try{ await rpc('fe_valet_status',{p_slug:SLUG,p_pin:pin,p_id:x.id,p_status:'buscando'}); fecharFolha(); carregar(); }catch(e){ msgE(ERR(e),'err'); } };
    if($('vVolta')) $('vVolta').onclick=async()=>{ try{ await rpc('fe_valet_status',{p_slug:SLUG,p_pin:pin,p_id:x.id,p_status:'estacionado'}); fecharFolha(); carregar(); }catch(e){ msgE(ERR(e),'err'); } };
  };
  const registrar=(token, x)=>{ x=x||{}; let fotos=[...(x.fotos||[])];
    abrirFolha(`<h3>${token?(x.placa?'✏️ Editar carro':'🎫 Ticket do convidado'):'➕ Carro sem QR'}</h3>${x.numero?`<p class="muted" style="margin-top:0">Ticket nº <b>${x.numero}</b>${x.nome?` · ${esc(x.nome)}`:''}</p>`:''}
      <div class="grid2"><label class="f">Placa *<input class="in" id="rgP" maxlength="8" autocapitalize="characters" autocomplete="off" value="${esc(x.placa||'')}" placeholder="ABC1D23" style="font:800 20px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase"></label>

    const prev=()=>{ $('rgPv').innerHTML=fotos.map((p,i)=>`<img src="${typeof p==='string'?midia(p):URL.createObjectURL(p)}" alt="" data-i="${i}" title="Tocar para tirar">`).join(''); $('rgPv').querySelectorAll('img').forEach(im=>im.onclick=()=>{ fotos.splice(+im.dataset.i,1); prev(); }); };
    prev(); $('eCancel').onclick=fecharFolha;
    $('rgF').onchange=e=>{ fotos=fotos.concat([...e.target.files]).slice(0,6); e.target.value=''; prev(); };
    $('eSend').onclick=async()=>{ const placa=$('rgP').value.toUpperCase().replace(/[^A-Z0-9]/g,''), vaga=$('rgV').value.trim();
      if(placa.length<5){ msgE('Digite a placa.','err'); return; } if(!vaga){ msgE('Informe onde o carro ficou.','err'); return; }
      $('eSend').disabled=true;
      try{ const caminhos=[]; let i=0; for(const p of fotos){ i++; if(typeof p==='string'){ caminhos.push(p); continue; } msgE(`<span class="spin"></span> Enviando foto ${i} de ${fotos.length}…`); caminhos.push(await subir(await encolher(p,1280,.8),'valet/foto','jpg','image/jpeg')); }
        const r=await rpc('fe_valet_registrar',{p_slug:SLUG,p_pin:pin,p_token:token||'',p_nome:$('rgN').value.trim(),p_placa:placa,p_modelo:$('rgM').value.trim(),p_vaga:vaga,p_fotos:caminhos,p_obs:$('rgO').value.trim()});
        if(!token){ abrirFolha(`<div class="center"><p class="muted" style="margin:0">Informe ao convidado</p><div class="vl-num" style="font-size:72px">nº ${r.numero}</div><p><span class="vl-placa">${esc(r.placa)}</span></p><p class="muted">Na saída, ele pede o carro pelo link da festa, em “Já deixei o carro e tenho o número do ticket”, ou direto com você.</p></div><div class="foot" style="justify-content:center"><button class="btn" id="eCancel">Pronto</button></div>`); $('eCancel').onclick=fecharFolha; }
        else { fecharFolha(); toast(`✅ nº ${r.numero} · ${r.placa} estacionado`,3000); }
        carregar(); }
      catch(e){ msgE(ERR(e),'err'); $('eSend').disabled=false; } };
  };
  $('vSem').onclick=()=>registrar('', {});
  $('vScan').onclick=async()=>{
    abrirFolha(`<h3>📷 Aponte para o QR do convidado</h3><div class="scan"><video id="scV" playsinline muted></video></div><div class="msg" id="eMsg"></div><div class="foot"><button class="btn ghost" id="eCancel">Fechar</button></div>`);
    let stream=null, vivo=true; const parar=()=>{ vivo=false; if(stream) stream.getTracks().forEach(t=>t.stop()); };
    $('eCancel').onclick=()=>{ parar(); fecharFolha(); };
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}); }catch(e){ msgE('Não consegui abrir a câmera. Libere a câmera para este site ou use “Sem QR”.','err'); return; }
    const v=$('scV'); v.srcObject=stream; await v.play().catch(()=>{});
    let det=null; try{ if('BarcodeDetector' in window){ const fm=await BarcodeDetector.getSupportedFormats(); if(fm.includes('qr_code')) det=new BarcodeDetector({formats:['qr_code']}); } }catch(e){}
    let jsQR=null; if(!det){ try{ jsQR=await carregarJsQR(); }catch(e){ msgE('Leitor indisponível. Use “Sem QR”.','err'); return; } }
    const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
    const ler=async()=>{ if(!vivo || !$('scV')) return; let txt=null;
      try{ if(det){ const r=await det.detect(v); if(r[0]) txt=r[0].rawValue; } else if(v.videoWidth){ const k=Math.min(1,640/v.videoWidth); cv.width=v.videoWidth*k; cv.height=v.videoHeight*k; cx.drawImage(v,0,0,cv.width,cv.height); const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height); if(r) txt=r.data; } }catch(e){}
      if(txt){ const m=/^MFV:([0-9a-f]{18})$/.exec(txt.trim()); if(!m){ msgE('Esse QR não é um ticket do manobrista.','err'); setTimeout(ler,1200); return; }
        parar(); if(navigator.vibrate) navigator.vibrate(120); await carregar(); const x=L.find(y=>y.token===m[1]);
        if(x && x.status!=='aguardando' && x.status!=='entregue') return ver(x);
        return registrar(m[1], x||{}); }
      requestAnimationFrame(()=>setTimeout(ler,120)); };
    ler();
  };
  carregar(); setInterval(()=>{ if(!document.hidden && $('ov').hidden) carregar(); }, 5000);
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
}

async function abrirPausas(slug, pin){
  abrirFolha(`<h3>⏸️ Pausar itens do cardápio</h3><p class="muted" style="margin-top:0">Acabou na cozinha? Toque no item para pausar. O convidado vê “acabou por agora” e não consegue pedir. Toque de novo para liberar.</p><div id="pzL"><div class="empty"><span class="spin"></span></div></div><div class="msg" id="eMsg"></div><div class="foot"><button class="btn" id="eCancel">Pronto</button></div>`);
  $('eCancel').onclick=fecharFolha; let L=[];
  const nomes={escolha:'Escolha antecipada',pedido:'Pedidos na mesa'};
  const render=()=>{ if(!L.length){ $('pzL').innerHTML='<div class="empty">Nenhum item no cardápio ainda.</div>'; return; }
    const grupos={}; L.forEach(i=>{ const k=i.tipo+'|'+i.secao; (grupos[k]=grupos[k]||[]).push(i); });
    let tipoAnt=''; $('pzL').innerHTML=Object.entries(grupos).map(([k,l])=>{ const [tp,sec]=k.split('|'); const todos=l.every(i=>i.pausado); const cab=tp!==tipoAnt?`<p class="muted" style="margin:16px 0 0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">${nomes[tp]}</p>`:''; tipoAnt=tp;
      return `${cab}<div class="pz-sec"><h4>${esc(sec)}</h4><button class="btn ghost sm" data-sec="${esc(k)}" data-v="${todos?0:1}">${todos?'▶ Liberar seção':'⏸ Pausar seção'}</button></div>${l.map(i=>`<button class="pz-it${i.pausado?' off':''}" data-id="${i.id}"><span>${esc(i.nome)}</span><span class="sw">${i.pausado?'⏸ pausado':'✓ disponível'}</span></button>`).join('')}`; }).join('');
    $('pzL').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{ const i=L.find(x=>x.id===+b.dataset.id); mudar([i.id], !i.pausado); });
    $('pzL').querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ const l=grupos[b.dataset.sec]; mudar(l.map(i=>i.id), b.dataset.v==='1'); }); };
  const mudar=async(ids, p)=>{ try{ await rpc('fe_equipe_pausar',{p_slug:slug,p_pin:pin,p_ids:ids,p_pausado:p}); L.forEach(i=>{ if(ids.includes(i.id)) i.pausado=p; }); render(); toast(p?'⏸ Pausado: os convidados já veem “acabou por agora”.':'▶ Liberado de novo.',2500); }catch(e){ msgE(ERR(e),'err'); } };
  try{ L=await rpc('fe_equipe_cardapio',{p_slug:slug,p_pin:pin}); render(); }catch(e){ msgE(ERR(e),'err'); }
}
function painelPedidos(pin){
  const f=FESTA; let L=[], vistos=null;
  $('app').innerHTML=`<div class="wrap"><div class="top"><h1>🧑‍🍳 Pedidos · <em>${esc(f.homenageado||f.titulo)}</em></h1><div class="row"><button class="btn alt sm" id="pdPausa">⏸️ Acabou algo?</button><button class="btn ghost sm" id="pdSom">🔔 Som ligado</button><button class="btn ghost sm" id="pdSair">Sair</button></div></div>
    ${f.pedidos_ativos?'':'<p class="aviso">Os pedidos na mesa estão desligados. O anfitrião liga em 🍽️ Cardápio e pedidos.</p>'}
    <div class="ped-board"><div class="ped-col"><h3>🆕 Novos <span class="muted" id="cN"></span></h3><div id="colN"></div></div><div class="ped-col"><h3>👨‍🍳 Preparando <span class="muted" id="cP"></span></h3><div id="colP"></div></div><div class="ped-col"><h3>✅ Entregues <span class="muted" style="font-size:13px">(últimos 30 min)</span></h3><div id="colE"></div></div></div></div>`;

  $('pdSair').onclick=()=>{ store.set('mf_eq_'+SLUG,null); location.reload(); };
  const bip=()=>{ if(!som) return; try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); [0,.18].forEach(d=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=880; g.gain.setValueAtTime(.0001,ac.currentTime+d); g.gain.exponentialRampToValueAtTime(.3,ac.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.15); o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.2); }); }catch(e){} if(navigator.vibrate) navigator.vibrate([150,80,150]); };
  const ha=d=>{ const m=Math.round((Date.now()-new Date(d))/60000); return m<1?'agora':`há ${m} min`; };
  const card=p=>`<div class="ped${p.status==='novo'?' ped-novo':''}"><div class="row" style="justify-content:space-between;align-items:baseline"><span class="m">Mesa ${p.mesa}</span><span class="t">${ha(p.criado_em)}</span></div>
      <ul>${p.itens.map(i=>`<li><b>${i.qtd}×</b> ${esc(i.nome)}</li>`).join('')}</ul>${p.obs?`<p style="margin:0 0 8px">📝 ${esc(p.obs)}</p>`:''}${p.nome?`<p class="t" style="margin:0 0 8px">${esc(p.nome)}</p>`:''}
      <div class="row">${p.status==='novo'?`<button class="btn sm" data-s="preparando" data-id="${p.id}">👨‍🍳 Preparar</button>`:''}${p.status!=='entregue'?`<button class="btn ok sm" data-s="entregue" data-id="${p.id}">✅ Entregue</button>`:''}${p.status==='novo'?`<button class="btn ghost sm" data-s="cancelado" data-id="${p.id}" style="flex:0">✕</button>`:''}${p.status==='entregue'?`<button class="btn ghost sm" data-s="preparando" data-id="${p.id}">↩ Desfazer</button>`:''}</div></div>`;
  const render=()=>{ const by=s=>L.filter(p=>p.status===s); $('colN').innerHTML=by('novo').map(card).join('')||'<div class="empty">Nenhum pedido novo.</div>'; $('colP').innerHTML=by('preparando').map(card).join('')||'<div class="empty">—</div>'; $('colE').innerHTML=by('entregue').reverse().map(card).join('')||'<div class="empty">—</div>';
    $('cN').textContent=by('novo').length||''; $('cP').textContent=by('preparando').length||''; document.title=(by('novo').length?`(${by('novo').length}) `:'')+'Pedidos · '+(f.homenageado||f.titulo);
    document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await rpc('fe_equipe_status',{p_slug:SLUG,p_pin:pin,p_id:+b.dataset.id,p_status:b.dataset.s}); await carregar(); }catch(e){ toast(ERR(e)); b.disabled=false; } }); };
  const carregar=async()=>{ try{ L=await rpc('fe_equipe_pedidos',{p_slug:SLUG,p_pin:pin}); const ids=new Set(L.map(p=>p.id)); if(vistos && L.some(p=>p.status==='novo' && !vistos.has(p.id))) bip(); vistos=ids; render(); }catch(e){ $('colN').innerHTML=`<div class="empty">${ERR(e)}</div>`; } };
  carregar(); setInterval(carregar, 5000);
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
}

async function paletaDe(blob){
  const bmp=await createImageBitmap(blob); const k=90/Math.max(bmp.width,bmp.height); const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(bmp.width*k)); cv.height=Math.max(1,Math.round(bmp.height*k));
  const c=cv.getContext('2d'); c.drawImage(bmp,0,0,cv.width,cv.height); const d=c.getImageData(0,0,cv.width,cv.height).data; const caixa={};
  for(let i=0;i<d.length;i+=4){ if(d[i+3]<140) continue; const key=(d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4); (caixa[key]=caixa[key]||{n:0,r:0,g:0,b:0}); const x=caixa[key]; x.n++; x.r+=d[i]; x.g+=d[i+1]; x.b+=d[i+2]; }
  const hsl=(r,g,b)=>{ r/=255;g/=255;b/=255; const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2; let h=0,s=0; if(M!==m){ const dd=M-m; s=l>.5?dd/(2-M-m):dd/(M+m); h = M===r?((g-b)/dd+(g<b?6:0)) : M===g?((b-r)/dd+2) : ((r-g)/dd+4); h*=60; } return [h,s,l]; };
  const hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
  const cores=Object.values(caixa).map(x=>{ const r=x.r/x.n,g=x.g/x.n,b=x.b/x.n,[h,s,l]=hsl(r,g,b); return {hex:hex(r,g,b),n:x.n,h,s,l,score:x.n*(0.05+s*s)*(l>.15&&l<.8?1:.003)}; }).sort((a,b)=>b.score-a.score);
  const tot=Object.values(caixa).reduce((t,x)=>t+x.n,0)||1, claros=Object.values(caixa).map(x=>({n:x.n,r:x.r/x.n,g:x.g/x.n,b:x.b/x.n})).filter(x=>hsl(x.r,x.g,x.b)[2]>.86).sort((a,b)=>b.n-a.n);
  const fundoClaro = claros.length && claros.reduce((t,x)=>t+x.n,0)/tot>.35 ? hex(claros[0].r,claros[0].g,claros[0].b) : null;
  const a1=cores.find(x=>x.l>.15&&x.l<.8&&x.s>.15)||cores[0]||{hex:'#7b2cbf',h:270}; const a2=cores.find(x=>{ const dh=Math.abs(x.h-a1.h); return Math.min(dh,360-dh)>40 && x.s>.25; }) || cores.find(x=>x!==a1 && x.s>.3 && Math.abs(x.l-a1.l)>.12 && x.l>.15 && x.l<.9) || cores[1] || {hex:'#ff9f1c'};
  const lum=h=>{ const v=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)); return .2126*v[0]+.7152*v[1]+.0722*v[2]; };
  const legivel=h=>{ let k=0, x=h; while(1.05/(lum(x)+.05)<4.5 && k<.9){ k+=.08; x=mix(h,'#1a1a1a',k); } return x; };
  return {accent:legivel(a1.hex), accent2:legivel(a2.hex), bg:fundoClaro||mix(a1.hex,'#ffffff',.9)};
}

async function encolherPng(file, max){ file=await prepararImagem(file).catch(()=>file); const bmp=await createImageBitmap(file); const k=Math.min(1,max/Math.max(bmp.width,bmp.height)); const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k); cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height); return await new Promise(r=>cv.toBlob(r,'image/png')); }
function textoConvite(f, senha){

  return `${CATS[f.categoria]?.e||'🎉'} *${f.titulo}*\n\n${f.data&&f.data>=new Date().toISOString().slice(0,10)?`Confirme sua presença pelo link 👇 e, no dia, deixe sua homenagem para ${f.homenageado||'o homenageado'}: foto, recado, áudio ou vídeo. Vai aparecer no telão da festa 💛`:`Deixe sua homenagem para ${f.homenageado||'o homenageado'}: foto, recado, áudio ou vídeo! Vai aparecer no telão da festa 💛`}\n\n👉 ${linkFesta(f.slug)}`;
}

function inicioDoTexto(img, fx, fy){ try{

  const fundo=px(Math.max(0,cx-Math.round(w*.3)), cy); const dif=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]);

async function zipTudo(f, posts, prog){
  const z=new JSZip(); const pastas={foto:'Fotos',audio:'Audios',video:'Videos'}; let i=0; const media=posts.filter(p=>p.caminho);
  for(const p of media){ i++; prog(`Juntando arquivo ${i} de ${media.length}…`); try{ const b=await fetch(midia(p.caminho)).then(r=>r.blob()); const ext=p.caminho.split('.').pop(); const nome=`${String(i).padStart(3,'0')}_${(p.autor||'convidado').replace(/[^\wÀ-ú ]+/g,'').trim().replace(/\s+/g,'_')||'convidado'}.${ext}`; const mo=momentoDe(p,f); z.folder(mo?`${mo.replace(/[\\/:*?"<>|]+/g,'')}/${pastas[p.tipo]}`:pastas[p.tipo]).file(nome,b); }catch(e){} }
  const rec=posts.filter(p=>p.tipo==='texto'||p.texto).map(p=>`${new Date(p.criado_em).toLocaleString('pt-BR')} — ${p.autor||'Convidado'}${p.tipo==='foto'?' (legenda de foto)':''}\n${p.texto}\n`).join('\n');
  z.file('Recados.txt', `${f.titulo}\n${f.homenageado||''}\n\n${rec}`);
  prog('Compactando…'); return await z.generateAsync({type:'blob'});
}

const RS_W=1080, RS_H=1920;
function resumoDados(f, posts){
  const ap=posts.filter(p=>!p.status || p.status==='aprovado');
  const n={foto:0,texto:0,audio:0,video:0}; let seg=0; const pessoas=new Set(); const horas={};
  ap.forEach(p=>{ n[p.tipo]=(n[p.tipo]||0)+1; if(p.tipo==='audio') seg+=(+p.duracao||0);
    const a=String(p.autor||'').trim().toLowerCase(); pessoas.add(a||('ap:'+(p.aparelho||p.id)));
    const h=new Date(p.criado_em).getHours(); horas[h]=(horas[h]||0)+1; });
  const pico=Object.entries(horas).sort((a,b)=>b[1]-a[1])[0];
  const nota=p=>(+p.curtidas||0)+Object.values(p.reacoes||{}).reduce((s,v)=>s+(+v||0),0);
  const comTexto=ap.filter(p=>p.texto && String(p.texto).trim().length>=8 && (p.tipo==='texto'||p.tipo==='foto'));
  const top=(comTexto.length?comTexto:ap.filter(p=>p.tipo==='foto')).slice().sort((a,b)=>nota(b)-nota(a)||String(b.texto||'').length-String(a.texto||'').length)[0]||null;
  const capa=ap.filter(p=>p.tipo==='foto').slice().sort((a,b)=>nota(b)-nota(a))[0]||null;
  return {ap, n, min:Math.max(seg?1:0, Math.round(seg/60)), pessoas:pessoas.size, pico:pico?+pico[0]:null, top, topNota:top?nota(top):0, capa};
}
function rsFundo(c, cor, brilho){
  c.fillStyle=cor; c.fillRect(0,0,RS_W,RS_H);
  if(brilho){ const g=c.createRadialGradient(RS_W/2,RS_H*.42,40,RS_W/2,RS_H*.42,RS_W*.95); g.addColorStop(0,brilho); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.fillRect(0,0,RS_W,RS_H); }
}
function rsTxt(c, txt, x, y, font, cor, {align='center', track=0, max=0}={}){
  c.font=font; c.fillStyle=cor; c.textAlign=align; c.textBaseline='alphabetic';
  if('letterSpacing' in c) c.letterSpacing=track+'px';
  let t=String(txt);
  if(max){ const m=font.match(/(\d+)px/); let px=m?+m[1]:0; const min=Math.round(px*.62); while(px>min && c.measureText(t).width>max){ px-=2; c.font=font.replace(/\d+px/, px+'px'); } while(c.measureText(t).width>max && t.length>4) t=t.slice(0,-2).trimEnd()+'…'; }
  c.fillText(t, x, y); if('letterSpacing' in c) c.letterSpacing='0px';
}
function rsLinhas(c, txt, x, y, font, cor, maxW, lh, maxL, align='center'){
  c.font=font; let L=wrap(c, txt, maxW); if(L.length>maxL){ L=L.slice(0,maxL); L[maxL-1]=L[maxL-1].replace(/\s*\S*$/,'')+'…'; }
  c.fillStyle=cor; c.textAlign=align; L.forEach((l,i)=>c.fillText(l, x, y+i*lh)); return y+L.length*lh;
}
function rsRodape(c, txt, P){ c.fillStyle=P.acc; c.fillRect(0,RS_H-150,RS_W,150); rsTxt(c, txt, RS_W/2, RS_H-62, '600 30px Figtree', P.cre, {max:RS_W-100}); }
function rsCapa(c, img, x, y, w, h, r){ c.save(); rr(c,x,y,w,h,r); c.clip(); const k=Math.max(w/img.width,h/img.height); const iw=img.width*k, ih=img.height*k; c.drawImage(img, x+(w-iw)/2, y+(h-ih)/2, iw, ih); c.restore(); }

function pixLimpa(s, max){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 .,-]/g,'').trim().slice(0,max).toUpperCase(); }
function pixChave(k){ k=String(k||'').trim(); const dig=k.replace(/\D/g,'');
  if(/@/.test(k)) return k.toLowerCase();
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k)) return k.toLowerCase();
  if(/^\+/.test(k)) return '+'+dig;
  if(dig.length===11 && !/[.\-]/.test(k) && /^\(?\d{2}\)?\s?9/.test(k)) return '+55'+dig;   // celular digitado sem +55
  if(dig.length===11 || dig.length===14) return dig;                                         // CPF / CNPJ
  if(dig.length===13 && dig.startsWith('55')) return '+'+dig;
  return k; }
function pixCRC(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++) c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF; } return c.toString(16).toUpperCase().padStart(4,'0'); }
function pixPayload(p, valor){ const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const conta=tlv('00','br.gov.bcb.pix')+tlv('01',pixChave(p.chave));
  const val=Number(valor)>0 ? tlv('54', Number(valor).toFixed(2)) : '';
  let s=tlv('00','01')+tlv('26',conta)+tlv('52','0000')+tlv('53','986')+val+tlv('58','BR')+tlv('59',pixLimpa(p.nome,25)||'PRESENTE')+tlv('60',pixLimpa(p.cidade,15)||'BRASIL')+tlv('62',tlv('05','***'))+'6304';
  return s+pixCRC(s); }

const DESC_N = f => { const r=EXT(f).revelacao; return r&&+r.fotos>0 ? +r.fotos : 0; };
const descUsadas = () => +store.get('mf_fotos_'+(FESTA&&FESTA.id))||0;
const descRestam = () => { const n=DESC_N(FESTA); return n ? Math.max(0, n-descUsadas()) : Infinity; };
function descBarra(){ const n=DESC_N(FESTA); if(!n) return ''; const r=descRestam(); return `<div class="desc-bar" role="status">📷 <b>Câmera descartável:</b> ${r>0?`restam <b>${r}</b> de ${n} fotos. Escolha bem!`:'seu filme acabou! Obrigado pelas fotos 💛'}</div>`; }
const REVELA = f => { const r=EXT(f).revelacao; if(!r||!r.em) return null; const t=new Date(r.em).getTime(); return t>Date.now()?t:null; };
const MOMENTOS_SUG = f => CORP(f) ? [['Credenciamento','18:00'],['Abertura','19:00'],['Palestras','19:30'],['Premiação','21:00'],['Confraternização','22:00']]
  : f.categoria==='casamento' ? [['Chegada','18:00'],['Cerimônia','19:00'],['Entrada dos noivos','20:30'],['Bolo','22:30'],['Pista','23:00']]
  : f.categoria==='quinze' ? [['Chegada','19:00'],['Entrada','20:30'],['Valsa','21:00'],['Bolo','22:30'],['Pista','23:00']]
  : [['Chegada','16:00'],['Brincadeiras','17:00'],['Parabéns','19:00'],['Pista','20:00']];
function momentoDe(p, f){ const L=(EXT(f).momentos||[]).filter(m=>m&&m.n&&m.h); if(!L.length||!p.criado_em) return null; const d=new Date(p.criado_em); let min=d.getHours()*60+d.getMinutes(); if(min<6*60) min+=24*60;
  const ms=L.map(m=>{ const [h,mm]=m.h.split(':').map(Number); let v=h*60+(mm||0); if(v<6*60) v+=24*60; return {n:m.n,v}; }).sort((a,b)=>a.v-b.v);
  let r=ms[0].n; for(const m of ms) if(min>=m.v) r=m.n; return r; }

function tvExtras(ex, agora){ ex=ex||{}; window.__tvEx=ex; try{ tvVideoCtl(ex.apr); }catch(_){} const off=agora?new Date(agora).getTime()-Date.now():0;
  document.body.classList.toggle('com-aviso',!!ex.aviso); let av=$('tvAviso'); if(ex.aviso){ if(!av){ av=document.createElement('div'); av.id='tvAviso'; av.className='tv-aviso'; document.body.appendChild(av); } if(av.dataset.t!==ex.aviso){ av.dataset.t=ex.aviso; av.innerHTML=`<span aria-hidden="true">📌</span><span>${esc(ex.aviso)}</span>`; } } else if(av) av.remove();
  const c=ex.contagem, fim=c&&c.ate?new Date(c.ate).getTime():0; let cd=$('tvCont');
  if(fim && fim-(Date.now()+off) > -15000){ if(!cd){ cd=document.createElement('div'); cd.id='tvCont'; cd.className='tv-cont'; document.body.appendChild(cd); }
    cd.dataset.fim=fim; cd.dataset.off=off; cd.dataset.txt=c.txt||''; tvContTick(); if(!window._tvCt) window._tvCt=setInterval(tvContTick,250); }
  else if(cd){ cd.remove(); clearInterval(window._tvCt); window._tvCt=null; } }
function tvContTick(){ const cd=$('tvCont'); if(!cd) return; const rest=Math.ceil((+cd.dataset.fim-(Date.now()+(+cd.dataset.off)))/1000);
  if(rest<=-15){ cd.remove(); clearInterval(window._tvCt); window._tvCt=null; return; }
  const k=Math.max(0,rest), lg=EXT(FESTA).logo?`<img class="cl" src="${midia(EXT(FESTA).logo)}" alt="">`:'';
  const html = rest>0 ? `<div>${lg}<div class="ck">${esc(cd.dataset.txt||'Começa em')}</div><div class="cn"><span><b>${p2(Math.floor(k/60))}</b><small>minutos</small></span><i>:</i><span><b>${p2(k%60)}</b><small>segundos</small></span></div><div class="cw">${esc(DESTAQUE(FESTA))}</div></div>`
    : `<div>${lg}<div class="cn"><b class="ja">Começando!</b></div><div class="cw">${esc(DESTAQUE(FESTA))}</div></div>`;

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mural da Festa</title>
<meta name="description" content="Fotos, recados, áudios e vídeos dos convidados no telão da festa — e um álbum de recordações no final.">
<meta property="og:title" content="Mural da Festa">
<meta property="og:description" content="Deixe sua homenagem: foto, recado, áudio ou vídeo!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%89%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,50;1,9..144,300..500,50&family=Figtree:wght@400;500;600;700&family=Cinzel:wght@600;700&family=Fredoka:wght@400;500;600;700&family=Great+Vibes&family=Luckiest+Guy&family=Pacifico&family=Playfair+Display:wght@600;700&display=swap">
<style>
/* Layout: cada festa veste o próprio tema (tokens trocados por JS); página do convidado = capa + 4 botões + mural; telão = palco em tela cheia; anfitrião e mestre = painéis em abas */
:root{
  --bg:#fffdf7; --bg2:#f3e8ff; --surface:#ffffff; --ink:#2a1745; --muted:#6d5c86;
  --accent:#7b2cbf; --accent2:#ff9f1c; --on:#ffffff; --line:rgba(42,23,69,.12);
  --display:'Luckiest Guy', 'Fredoka', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif:'Fraunces', Georgia, serif;
  --hand:'Caveat', 'Fredoka', cursive;
  --ok:#2f9e44; --bad:#e03131; --warn:#f08c00;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%;overflow-x:hidden;
  background:radial-gradient(120% 70% at 50% -10%, var(--bg2) 0%, transparent 60%), var(--bg)}
[hidden]{display:none!important}
img,video{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
#bgimg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
#bgimg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--veu,.8)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--on);transition:transform .12s, filter .15s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
.btn.alt{background:var(--accent2);color:var(--on2,var(--ink))}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff} .btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.in, textarea.in, select.in{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 13px;min-width:0}
textarea.in{min-height:120px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--muted);min-width:0}
.msg{min-height:22px;font-weight:600;font-size:15px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%, transparent);color:var(--accent);font-weight:600;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
h2.sec{font-weight:700;font-size:22px;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.center{text-align:center}

/* ---------- capa do convidado ---------- */
.hero{padding:28px 20px 24px;text-align:center;position:relative;overflow:hidden}
.hero .who{font-family:var(--display);font-size:clamp(44px,11vw,96px);line-height:1.05;margin:10px 0 4px;color:var(--accent);text-wrap:balance;word-break:break-word}
.hero .tit{font-weight:700;font-size:clamp(18px,3.6vw,26px);margin:0;text-wrap:balance}
.hero .sub{font-weight:600;color:var(--accent2);font-size:clamp(16px,3vw,22px);margin-top:4px;filter:brightness(.85)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;color:var(--muted);font-weight:500;margin-top:14px}
.hero .msgf{max-width:620px;margin:14px auto 0;font-size:17px}
.hero .deco{position:absolute;font-size:44px;opacity:.9;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:640px){.acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;border-radius:22px;padding:20px 8px;cursor:pointer;font-weight:700;font-size:17px;
  background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.06);transition:transform .15s}
.act:hover{transform:translateY(-3px)} .act .ic{font-size:40px;line-height:1}
.act:nth-child(1){background:var(--accent);color:var(--on);border-color:transparent}
.act:nth-child(4){background:var(--accent2);color:var(--ink);border-color:transparent}
.namebar{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;justify-content:center}
.namebar .in{max-width:280px}
.closed{padding:16px;border-radius:18px;background:color-mix(in srgb,var(--accent2) 22%, var(--surface));font-weight:600;text-align:center;margin-top:16px}

/* ---------- mural ---------- */
.mural{columns:3 260px;column-gap:12px}
.post{break-inside:avoid;margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.05)}
.post img,.post video{display:block;width:100%;height:auto;background:#000}
.post .pb{padding:10px 14px 12px}
.post .by{font-weight:600;color:var(--muted);font-size:14px}
.post.t .pb{padding:18px 18px 14px}
.post.t blockquote{margin:0 0 8px;font-family:var(--hand);font-size:28px;line-height:1.15;word-break:break-word}
.post.a .pb{display:flex;flex-direction:column;gap:8px}
.post audio{width:100%}
.empty{column-span:all;padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:18px}

/* ---------- folha (envio) ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,8,20,.55);display:grid;place-items:center;backdrop-filter:blur(3px);
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:26px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .25s ease both}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sheet h3{margin:0 0 12px;font-size:24px;display:flex;align-items:center;gap:10px}
.sheet .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:3px dashed var(--line);border-radius:20px;padding:26px 12px;text-align:center;font-weight:600;cursor:pointer;background:var(--bg)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .ic{font-size:44px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugs button{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 10px;cursor:pointer;font-size:14px}
.rec{display:flex;flex-direction:column;align-items:center;gap:12px}
.rec .time{font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.rec canvas{width:100%;height:90px;border-radius:14px;background:var(--bg)}
.recbtn{width:92px;height:92px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 25%, transparent)}
.recbtn.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px color-mix(in srgb,var(--bad) 10%, transparent)}}
.vbox{position:relative;width:100%;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:60vh}
.vbox video{width:100%;height:100%;object-fit:cover;display:block}
.vbox .live{transform:scaleX(-1)}
.vbox .badge{position:absolute;top:10px;left:10px;background:var(--bad);color:#fff;border-radius:999px;padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.alt{font-size:14px;color:var(--muted);text-align:center}
.alt label{text-decoration:underline;cursor:pointer;position:relative}
.alt input{position:absolute;opacity:0;width:1px;height:1px}
.thanks{text-align:center;padding:10px 0}
.thanks .big{font-size:64px}

/* ---------- telão ---------- */
.tv{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:auto 1fr auto;color:var(--ink)}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 3vw 6px}
.tv-top .t{font-family:var(--display);font-size:clamp(28px,4vw,64px);color:var(--accent);line-height:1}
.tv-top .n{font-weight:700;font-size:clamp(16px,1.6vw,26px);color:var(--muted)}
.stage{position:relative;overflow:hidden;margin:0 3vw}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;animation:fadein .8s ease both}
@keyframes fadein{from{opacity:0;transform:scale(.98)}}
.sl.out{animation:fadeout .6s ease both}
@keyframes fadeout{to{opacity:0}}
.sl-foto .ph{max-width:100%;max-height:calc(100% - 11vh);min-height:0;object-fit:contain;border-radius:2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.35);border:1vh solid #fff;animation:kb 10s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.sl .cap{font-family:var(--hand);font-size:clamp(26px,3.4vw,58px);text-align:center;max-width:90%;line-height:1.1}
.sl .cap small{display:block;font-family:var(--body);font-weight:600;font-size:.45em;color:var(--muted);margin-top:.4em}
.sl-texto .q{font-family:var(--hand);text-align:center;max-width:88%;line-height:1.1;word-break:break-word}
.sl-texto .q::before{content:"“";display:block;font-family:var(--display);color:var(--accent);font-size:1.4em;line-height:.6}
.sl-texto .by{font-weight:700;font-size:clamp(20px,2.4vw,40px);color:var(--accent)}
.sl-video video{max-width:100%;max-height:calc(100% - 8vh);min-height:0;border-radius:2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.35);background:#000}
.eq{display:flex;align-items:flex-end;gap:1.2vh;height:28vh}
.eq i{width:3.2vh;border-radius:1.6vh;background:var(--accent);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2n){background:var(--accent2);animation-duration:.8s}
.eq i:nth-child(3n){animation-duration:1.25s}
@keyframes eq{0%,100%{height:15%}50%{height:100%}}
.sl-audio .mic{font-size:12vh}
.tv-bar{display:flex;align-items:center;gap:2vw;padding:1.2vh 3vw 2.2vh}
.tv-bar .qr{background:#fff;padding:1vh;border-radius:1.4vh;line-height:0}
.tv-bar .qr{width:17vh;flex:none}
.tv-bar b{display:block;font-size:clamp(20px,2.6vw,44px);font-family:var(--display);color:var(--accent)}
.tv-bar span{font-weight:600;font-size:clamp(14px,1.5vw,24px);color:var(--muted)}
.tv-bar .acts-mini{margin-left:auto;font-size:clamp(28px,3.4vw,56px);letter-spacing:.2em}
.tv-start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:color-mix(in srgb,var(--bg) 88%, transparent);padding:16px}
.tv-start .who{font-family:var(--display);font-size:clamp(48px,9vw,140px);color:var(--accent);line-height:1}
.tv-empty{display:flex;flex-direction:column;align-items:center;gap:3vh;text-align:center}
.tv-empty .qr{background:#fff;padding:2vh;border-radius:2vh;line-height:0}
.tv-empty .qr{width:40vh}
.stage .sl.tv-empty{z-index:3}
.tv-empty h2{font-family:var(--display);color:var(--accent);font-size:clamp(32px,5vw,80px);margin:0;font-weight:400}
.tv-empty p{font-size:clamp(18px,2vw,32px);font-weight:600;margin:0;color:var(--muted)}
.chars{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.ch{position:absolute;line-height:0}
.ch img{height:min(30vh,30vw);width:auto;max-width:40vw;object-fit:contain;filter:drop-shadow(0 1.5vh 2.5vh rgba(0,0,0,.35))}
.ch img.sticker{height:min(26vh,26vw);background:#fff;padding:.9vh;border-radius:2.2vh;transform:rotate(var(--r));box-shadow:0 1.6vh 3.5vh rgba(0,0,0,.35);filter:none}
.ch .emo{font-size:min(20vh,24vw);line-height:1;filter:drop-shadow(0 1vh 2vh rgba(0,0,0,.25))}
.ch.pk-l{left:1vw;bottom:calc(var(--bh,22vh) + 1vh);animation:pkl 6.5s cubic-bezier(.3,1.3,.5,1) both}
.ch.pk-r{right:1vw;bottom:calc(var(--bh,22vh) + 1vh);animation:pkr 6.5s cubic-bezier(.3,1.3,.5,1) both}
.ch.pk-b{left:50%;bottom:calc(var(--bh,22vh) + 1vh);animation:pkb 6.5s ease both}
.ch.voa{top:10vh;left:0;animation:voa 7s linear both}
.ch.pula{left:6vw;bottom:calc(var(--bh,22vh) + 1vh);animation:pula 6.5s ease-in-out both}
@keyframes pkl{0%{transform:translateX(-130%) rotate(-25deg)}14%{transform:translateX(0) rotate(10deg)}22%{transform:rotate(-7deg)}32%{transform:rotate(5deg)}45%{transform:translateY(-3vh) rotate(-3deg)}58%{transform:translateY(0) rotate(4deg)}84%{transform:translateX(0) rotate(0)}100%{transform:translateX(-140%) rotate(-20deg)}}
@keyframes pkr{0%{transform:translateX(130%) rotate(25deg)}14%{transform:translateX(0) rotate(-10deg)}22%{transform:rotate(7deg)}32%{transform:rotate(-5deg)}45%{transform:translateY(-3vh) rotate(3deg)}58%{transform:translateY(0) rotate(-4deg)}84%{transform:translateX(0) rotate(0)}100%{transform:translateX(140%) rotate(20deg)}}
@keyframes pkb{0%{transform:translate(-50%,110%)}16%{transform:translate(-50%,-6%) scale(1.05)}24%{transform:translate(-50%,2%) scale(.97)}32%,78%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4%) rotate(4deg)}64%{transform:translate(-50%,0) rotate(-4deg)}100%{transform:translate(-50%,115%)}}
@keyframes voa{0%{transform:translate(-45vw,0) rotate(-8deg)}25%{transform:translate(20vw,-4vh) rotate(6deg)}50%{transform:translate(50vw,3vh) rotate(-6deg)}75%{transform:translate(80vw,-4vh) rotate(6deg)}100%{transform:translate(115vw,0) rotate(-8deg)}}
@keyframes pula{0%{transform:translate(-50vw,0)}12%{transform:translate(0,0)}20%{transform:translate(0,-10vh) rotate(-8deg)}28%{transform:translate(0,0) scale(1.05,.93)}36%{transform:translate(0,-6vh) rotate(8deg)}44%{transform:translate(0,0)}52%{transform:translate(0,-3vh)}60%,82%{transform:translate(0,0)}100%{transform:translate(-55vw,0)}}
.conf{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.conf i{position:absolute;top:-4vh;width:1.5vh;height:.9vh;border-radius:2px;animation:cf 3s ease-in both}
@keyframes cf{to{transform:translate(var(--x),112vh) rotate(var(--g))}}
.sl.e-zoom{animation:ezoom .9s cubic-bezier(.3,1.4,.5,1) both}
.sl.e-left{animation:eleft .8s cubic-bezier(.3,1.2,.5,1) both}
.sl.e-right{animation:eright .8s cubic-bezier(.3,1.2,.5,1) both}
.sl.e-up{animation:eup .8s cubic-bezier(.3,1.2,.5,1) both}
.sl.e-tilt{animation:etilt .9s cubic-bezier(.3,1.3,.5,1) both}
@keyframes ezoom{from{opacity:0;transform:scale(.6)}}
@keyframes eleft{from{opacity:0;transform:translateX(-40vw) rotate(-6deg)}}
@keyframes eright{from{opacity:0;transform:translateX(40vw) rotate(6deg)}}
@keyframes eup{from{opacity:0;transform:translateY(30vh)}}
@keyframes etilt{from{opacity:0;transform:rotate(-14deg) scale(.8)}}
.sl.out{animation:fadeout .6s ease both !important}
.sl-foto .ph{transform:rotate(var(--r,0deg))}
.pol{background:#fff;padding:1.2vh 1.2vh 1.2vh;border-radius:.8vh;box-shadow:0 2vh 6vh rgba(0,0,0,.38);transform:rotate(var(--r));max-width:92%;line-height:0;overflow:hidden;animation:polin .9s cubic-bezier(.3,1.5,.5,1) both}
.pol img{max-height:calc(var(--sh,60vh) - 13vh);max-width:86vw;object-fit:contain;display:block;animation:kb 7s ease-out both}
@keyframes polin{from{opacity:0;transform:rotate(calc(var(--r) * 3)) scale(.5) translateY(-20vh)}}
.sl-col{display:block}
.sl-col .pol{position:absolute;max-width:44%}
.sl-col .pol img{max-height:calc(var(--sh,60vh) * .52);max-width:40vw}
.sl-col .c1{left:4%;top:6%} .sl-col .c2{left:30%;top:24%;z-index:2} .sl-col .c3{right:4%;top:2%}
.sl-col .cap{position:absolute;left:0;right:0;bottom:1vh;margin:auto}
.sl-intro{text-align:center}
.sl-intro .hey{font-weight:700;font-size:clamp(18px,2.6vw,42px);color:var(--muted)}
.sl-intro .nm{font-family:var(--display);color:var(--accent);font-size:clamp(54px,11vw,190px);line-height:1;text-shadow:0 .6vh 0 color-mix(in srgb,var(--accent2) 60%, transparent)}
.sl-intro .nm span{display:inline-block;animation:onda 1.6s ease-in-out infinite}
@keyframes onda{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3vh) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.sl-intro .sub{font-weight:700;font-size:clamp(22px,3.4vw,56px);color:var(--ink)}
.sl-intro .cta{font-weight:600;font-size:clamp(15px,1.8vw,30px);color:var(--muted);background:color-mix(in srgb,var(--surface) 80%, transparent);padding:1.2vh 2.4vw;border-radius:99px}
.novo{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:3;background:var(--accent);color:var(--on);font-weight:800;font-size:clamp(16px,2.2vw,36px);padding:.8vh 2.4vw;border-radius:99px;box-shadow:0 1vh 3vh rgba(0,0,0,.25);animation:novo 1s ease-in-out infinite alternate}
@keyframes novo{to{transform:translateX(-50%) scale(1.08)}}
.tv-empty .qr{width:min(calc(var(--sh,60vh) - 22vh),62vw)}
.sl-foto .ph{max-height:calc(var(--sh,60vh) - 12vh) !important;max-width:88vw !important}
.sl-video video{max-height:calc(var(--sh,60vh) - 7vh) !important}
.tv-hint{position:fixed;right:12px;bottom:8px;z-index:6;font-size:12px;color:var(--muted);opacity:.5}

/* ---------- painéis ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;font-size:clamp(22px,4vw,32px)}
.top h1 em{font-style:normal;font-family:var(--display);color:var(--accent);font-weight:400}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tabs button{border:0;border-radius:999px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:transparent}
.tabs .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;line-height:20px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{display:flex;flex-direction:column;overflow:hidden}
.mod .media img,.mod .media video{display:block;width:100%;max-height:300px;object-fit:cover;background:#000}
.mod .media audio{width:100%;margin-top:10px}

/* =================== acabamento: lembrança, não panfleto =================== */
body{font-size:16.5px;line-height:1.55;letter-spacing:.003em;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:450;letter-spacing:-.01em;font-variation-settings:"SOFT" 50}
h2.sec{font-family:var(--serif);font-weight:420;font-size:clamp(24px,4vw,30px);margin:44px 0 14px;gap:12px}

.card{border-radius:24px;box-shadow:0 1px 2px rgba(30,20,40,.04),0 12px 32px -18px rgba(30,20,40,.18)}
.btn{font-weight:600;letter-spacing:.01em;padding:12px 20px;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 70%, transparent)}
.btn.ghost{border-width:1px;box-shadow:none;background:color-mix(in srgb,var(--surface) 70%, transparent)}
.btn.alt{box-shadow:none}
.btn.sm{padding:8px 14px}
.in, textarea.in, select.in{border-width:1px;border-radius:12px;background:var(--surface);transition:border-color .15s, box-shadow .15s}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%, transparent)}
.chip{font-weight:600;background:transparent;border:1px solid color-mix(in srgb,var(--accent) 35%, transparent)}
.ic svg{width:1em;height:1em;display:block}
.tabs{gap:4px;padding:4px;background:color-mix(in srgb,var(--surface) 75%, transparent);border:1px solid var(--line);border-radius:999px;width:fit-content;max-width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.tabs button{border:0;background:transparent;white-space:nowrap;padding:9px 16px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on);box-shadow:0 4px 12px -6px var(--accent)}
.sheet{border-radius:28px;padding:24px}
.sheet h3{font-size:26px}

  box-shadow:0 18px 40px -22px rgba(30,20,40,.45), 0 0 0 1px var(--line);animation:arcoIn 1.1s cubic-bezier(.2,.8,.2,1) both}

const TRILHAS = {
  festa:    {n:'Festa animada', e:'🎉', d:'alegre, para dançar',        bpm:116, root:60, wave:'triangle', prog:[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]], pat:[0,1,2,1,0,2,1,2], hat:1},
  doce:     {n:'Doce e suave',  e:'🧸', d:'calminha, para chá e bebê', bpm:80,  root:65, wave:'sine',     prog:[[0,4,7,11],[5,9,12,16],[2,5,9,12],[7,11,14,17]], pat:[0,2,1,3,0,2,1,3]},
  romantica:{n:'Romântica',     e:'💞', d:'para bodas, casamento, 15 anos', bpm:68, root:57, wave:'sine', prog:[[0,4,7,11],[-3,0,4,7],[5,9,12,16],[7,11,14,17]], pat:[0,1,2,3,2,1,2,3]},
  infantil: {n:'Brincadeira',   e:'🎈', d:'saltitante, para a criançada', bpm:132, root:67, wave:'square', prog:[[0,4,7],[5,9,12],[7,11,14],[0,4,7]], pat:[0,1,2,1,2,1,0,2], hat:1}
};
function motorTrilha(tr){
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  let ac=null, master=null, timer=null, next=0, step=0, ruido=null;
  const hz=n=>440*Math.pow(2,(n-69)/12), e8=60/tr.bpm/2;
  function nota(n,t,dur,g,wave){ const o=ac.createOscillator(), e=ac.createGain(); o.type=wave; o.frequency.value=hz(n); e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(g,t+.015); e.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(e); e.connect(master); o.start(t); o.stop(t+dur+.05); }
  function pad(ch,t,dur){ ch.forEach(x=>{ const o=ac.createOscillator(), e=ac.createGain(); o.type='sine'; o.frequency.value=hz(tr.root+x); e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(.03,t+dur*.35); e.gain.linearRampToValueAtTime(0,t+dur); o.connect(e); e.connect(master); o.start(t); o.stop(t+dur+.05); }); }
  function hat(t){ if(!ruido){ ruido=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate); const d=ruido.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); } const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(); s.buffer=ruido; f.type='highpass'; f.frequency.value=7000; g.gain.value=.05; s.connect(f); f.connect(g); g.connect(master); s.start(t); }
  function agenda(){ while(next < ac.currentTime+.3){ const bar=Math.floor(step/8)%tr.prog.length, ch=tr.prog[bar], k=step%8;
      if(k===0) pad(ch,next,e8*8);
      if(k===0||k===4) nota(tr.root+ch[0]-24,next,e8*3.6,.2,'sine');
      nota(tr.root+12+ch[tr.pat[k]%ch.length],next,e8*1.7,tr.wave==='square'?.028:tr.wave==='triangle'?.07:.09,tr.wave);
      if(tr.hat && (k===2||k===6)) hat(next);
      next+=e8; step++; } }
  return {
    start(){ if(!ac){ ac=new AC(); master=ac.createGain(); master.gain.value=0; master.connect(ac.destination); next=ac.currentTime+.12; timer=setInterval(agenda,90); agenda(); } if(ac.resume) ac.resume(); },
    level(v){ if(!ac) return; master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(v*.9, ac.currentTime, .35); },
    stop(){ clearInterval(timer); if(ac) ac.close().catch(()=>{}); ac=null; }
  };
}
function motorArquivos(faixas){
  const a=new Audio(); a.preload='auto'; let i=0, alvo=0, fadeT=null;
  a.src=midia(faixas[0]); a.volume=0;
  a.onended=()=>{ i=(i+1)%faixas.length; a.src=midia(faixas[i]); if(alvo>0) a.play().catch(()=>{}); };
  a.onerror=()=>{ if(faixas.length>1){ i=(i+1)%faixas.length; a.src=midia(faixas[i]); if(alvo>0) a.play().catch(()=>{}); } };
  return {
    start(){ a.play().catch(()=>{}); },
    level(v){ alvo=v; clearInterval(fadeT); if(v>0 && a.paused) a.play().catch(()=>{});
      fadeT=setInterval(()=>{ const d=alvo-a.volume; if(Math.abs(d)<.05){ a.volume=alvo; clearInterval(fadeT); if(alvo===0) a.pause(); return; } a.volume=Math.max(0,Math.min(1,a.volume+Math.sign(d)*.05)); },50); },
    stop(){ clearInterval(fadeT); a.pause(); }
  };
}
function criarMusica(m){
  if(!m || !m.tipo || m.tipo==='nenhuma') return null;
  const faixas=(m.faixas||[]).filter(Boolean);
  const eng = m.tipo==='upload' ? (faixas.length ? motorArquivos(faixas) : null) : motorTrilha(TRILHAS[m.trilha]||TRILHAS.festa);
  if(!eng) return null;
  let duck=false, mudo=false; const vol=Math.max(.1,Math.min(1,m.volume ?? .55));
  const ap=()=>eng.level(mudo||duck?0:vol);
  return { start(){ eng.start(); ap(); }, duck(on){ duck=!!on; ap(); }, mute(){ mudo=!mudo; ap(); return mudo; }, stop(){ eng.stop(); } };
}

// ---------- efeito de fundo ----------
const fx = (()=>{
  const cv=$('fx'), c=cv.getContext('2d'); let parts=[], t=null, raf=0, W=0, H=0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ const d=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; c.setTransform(d,0,0,d,0,0); }
  function mk(i){ const p=t.pal; return {x:Math.random()*W, y:Math.random()*H, s:6+Math.random()*16, v:.2+Math.random()*.6, r:Math.random()*6.28, vr:(Math.random()-.5)*.03, c:p[i%p.length], ph:Math.random()*6.28}; }
  function draw(){
    c.clearRect(0,0,W,H);
    for(const p of parts){
      c.save(); c.translate(p.x,p.y); c.globalAlpha = t.dark ? .6 : .32;
      switch(t.pat){
        case 'confete': c.rotate(p.r); c.fillStyle=p.c; c.fillRect(-p.s/2,-p.s/5,p.s,p.s/2.4); break;
        case 'baloes': { const s=p.s*1.8; c.fillStyle=p.c; c.beginPath(); c.ellipse(0,0,s*.42,s*.52,0,0,6.28); c.fill(); c.strokeStyle=p.c; c.lineWidth=1; c.beginPath(); c.moveTo(0,s*.52); c.quadraticCurveTo(6,s*.9,0,s*1.3); c.stroke(); c.globalAlpha*=.6; c.fillStyle='#fff'; c.beginPath(); c.ellipse(-s*.14,-s*.2,s*.08,s*.14,-.5,0,6.28); c.fill(); break; }
        case 'estrelas': { const a=.35+.65*Math.abs(Math.sin(p.ph)); c.globalAlpha=a; c.fillStyle=p.c; c.beginPath(); c.arc(0,0,Math.max(.8,p.s/9),0,6.28); c.fill(); break; }
        case 'bolhas': c.strokeStyle=p.c; c.lineWidth=2; c.beginPath(); c.arc(0,0,p.s*.7,0,6.28); c.stroke(); c.globalAlpha*=.5; c.fillStyle='#fff'; c.beginPath(); c.arc(-p.s*.25,-p.s*.25,p.s*.15,0,6.28); c.fill(); break;
        case 'brilho': { const a=.25+.75*Math.abs(Math.sin(p.ph)); c.globalAlpha=a*(t.dark?.95:.7); c.fillStyle=p.c; const s=p.s*.7; c.beginPath(); c.moveTo(0,-s); c.quadraticCurveTo(0,0,s,0); c.quadraticCurveTo(0,0,0,s); c.quadraticCurveTo(0,0,-s,0); c.quadraticCurveTo(0,0,0,-s); c.fill(); break; }
        case 'petalas': c.rotate(p.r); c.fillStyle=p.c; c.beginPath(); c.ellipse(0,0,p.s*.5,p.s*.22,0,0,6.28); c.fill(); break;
      }
      c.restore();
    }
  }
  function step(){
    for(const p of parts){
      p.ph+=.03; p.r+=p.vr;
      if(t.pat==='baloes'||t.pat==='bolhas'){ p.y-=p.v; p.x+=Math.sin(p.ph)*.3; if(p.y<-60){ p.y=H+40; p.x=Math.random()*W; } }
      else if(t.pat==='estrelas'||t.pat==='brilho'){ p.y+=p.v*.08; if(p.y>H+10) p.y=-10; }
      else { p.y+=p.v; p.x+=Math.sin(p.ph)*.5; if(p.y>H+20){ p.y=-20; p.x=Math.random()*W; } }
    }
    draw(); raf=requestAnimationFrame(step);
  }
  addEventListener('resize', ()=>{ if(t){ size(); draw(); } });
  return {
    start(th){ t=th; cancelAnimationFrame(raf); size(); const n = th.pat==='estrelas' ? 46 : th.pat==='brilho' ? 20 : 14; parts=Array.from({length:n},(_,i)=>mk(i)); draw(); if(!reduce) raf=requestAnimationFrame(step); },
    stop(){ cancelAnimationFrame(raf); c.clearRect(0,0,W,H); }
  };
})();

// Fotos HEIC/HEIF (padrão de vários Samsung e iPhone) não abrem no navegador: convertemos para JPG
let _heic=null;
function carregarHeic(){ return _heic || (_heic=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js'; sc.onload=()=>window.heic2any?res(window.heic2any):rej(new Error('heic')); sc.onerror=()=>{ _heic=null; rej(new Error('heic')); }; document.head.appendChild(sc); })); }
const ehHeic=f=>/hei[cf]/i.test(f.type||'')||/\.(heic|heif)$/i.test(f.name||'');
async function paraJpeg(file){ const h=await carregarHeic(); let out=await h({blob:file,toType:'image/jpeg',quality:.9}); if(Array.isArray(out)) out=out[0]; return new File([out], String(file.name||'foto').replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg'}); }
async function abreNoNavegador(file){ try{ const b=await createImageBitmap(file); if(b.close) b.close(); return true; }catch(e){ return false; } }
async function prepararImagem(file){
  if(!file || !(file instanceof Blob)) return file;
  if(ehHeic(file)) return await paraJpeg(file);
  if(await abreNoNavegador(file)) return file;
  try{ return await paraJpeg(file); }catch(e){ return file; }
}
async function encolher(file, max=1600, q=.82){
  file = await prepararImagem(file).catch(()=>file);
  let bmp; try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){ bmp=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const k=Math.min(1, max/Math.max(bmp.width,bmp.height)); const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height); return await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
}
function videoThumb(blob){
  return new Promise(res=>{
    const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto'; const url=URL.createObjectURL(blob); v.src=url;
    let done=false; const fin=b=>{ if(done) return; done=true; URL.revokeObjectURL(url); res(b); };
    const grab=()=>{ try{ const w=v.videoWidth||640, h=v.videoHeight||480, k=Math.min(1,900/Math.max(w,h)); const cv=document.createElement('canvas'); cv.width=Math.round(w*k); cv.height=Math.round(h*k); cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height); cv.toBlob(b=>fin(b),'image/jpeg',.82); }catch(e){ fin(null); } };
    v.addEventListener('loadeddata', async ()=>{ try{ await v.play(); await sleep(350); v.pause(); }catch(e){} grab(); }, {once:true});
    v.addEventListener('error', ()=>fin(null), {once:true});

}

  return `<div class="pacoes"><button class="curtir${on?' on':''}" data-like="${p.id}" aria-pressed="${on}" aria-label="Curtir"><span class="co">${on?'♥':'♡'}</span><b>${p.curtidas||0}</b></button>${p.tipo==='foto'?`<button class="molbtn" data-mol="${p.id}">🖼️ Postar com moldura</button>`:''}</div>`;
}
function cardPost(p){
  const by = p.autor ? `<div class="by">— ${esc(p.autor)}</div>` : '';
  if(p.tipo==='foto') return `<figure class="post"><img loading="lazy" src="${midia(p.caminho)}" alt="${esc(p.texto||'Foto da festa')}"><figcaption class="pb">${p.texto?`<div>${esc(p.texto)}</div>`:''}${by}${acoesPost(p)}</figcaption></figure>`;
  if(p.tipo==='texto') return `<div class="post t"><div class="pb"><blockquote>${esc(p.texto)}</blockquote>${by}${acoesPost(p)}</div></div>`;
  if(p.tipo==='audio') return `<div class="post a"><div class="pb"><div style="font-weight:700">🎤 Recado em áudio · ${fmtDur(p.duracao)}</div><audio controls preload="none" src="${midia(p.caminho)}"></audio>${by}${acoesPost(p)}</div></div>`;
  if(p.tipo==='video') return `<div class="post"><video controls playsinline preload="none" poster="${p.thumb?midia(p.thumb):''}" src="${midia(p.caminho)}"></video><div class="pb"><div style="font-weight:700">🎥 Recado em vídeo · ${fmtDur(p.duracao)}</div>${by}${acoesPost(p)}</div></div>`;
  return '';
}
async function curtir(btn){

// ---------- gravação de áudio e vídeo ----------
function escolherMime(kind){
  const op = kind==='video' ? ['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'] : ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
  if(!window.MediaRecorder) return null; return op.find(m=>{ try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } }) || '';
}
function pararCaptura(){
  if(!recState) return;
  try{ if(recState.rec && recState.rec.state!=='inactive') recState.rec.stop(); }catch(e){}
  try{ recState.stream && recState.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ recState.ac && recState.ac.close(); }catch(e){}
  clearInterval(recState.timer); cancelAnimationFrame(recState.raf); recState=null;
}
function folhaGravar(kind){
  const v = kind==='video';
  const podeGravar = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && escolherMime(kind)!==null);

    }catch(e){ msgE(v?'Não consegui gravar. Libere câmera e microfone ou escolha um vídeo do celular.':'Não consegui usar o microfone. Libere a permissão ou escolha um áudio do celular.','err'); }

async function conferirPagamento(pid){
  const antes = FESTA.plano;
  abrirFolha(`<div class="thanks"><div class="big">💳</div><h3 style="justify-content:center">Confirmando o pagamento…</h3><p id="cpT">Assim que o Mercado Pago confirmar, sua festa é liberada. No Pix costuma ser na hora.</p><div class="center"><span class="spin"></span></div>
    <div class="foot" style="justify-content:center"><button class="btn ghost" id="eCancel">Fechar</button></div></div>`);
  $('eCancel').onclick=()=>{ fecharFolha(); };
  const limpa=()=>{ const q=new URLSearchParams(location.search); q.delete('pago'); q.delete('collection_id'); q.delete('collection_status'); q.delete('payment_id'); q.delete('status'); q.delete('external_reference'); q.delete('payment_type'); q.delete('merchant_order_id'); q.delete('preference_id'); q.delete('site_id'); q.delete('processing_mode'); q.delete('merchant_account_id'); history.replaceState(null,'',location.pathname+'?'+q.toString().replace(/=(&|$)/g,'$1')); };
  for(let i=0;i<90;i++){
    let st='';
    try{ const r=await fetch(FN_PAG,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify({acao:'conferir', pagamento:pid})}); const j=await r.json(); st=j.status||''; }catch(e){}
    try{ FESTA = await carregarFesta(SLUG); }catch(e){}
    if(FESTA && FESTA.plano!=='teste' && FESTA.plano!==antes || (FESTA && FESTA.plano!=='teste' && st==='approved')){
      limpa(); store.set('mf_pag_'+SLUG,null);
      $('sheet').innerHTML=`<div class="thanks"><div class="big">🎉</div><h3 style="justify-content:center">Pagamento confirmado!</h3><p>Sua festa está liberada no plano <b>${esc(NOME_PLANO[FESTA.plano]||FESTA.plano)}</b>: até ${FESTA.max_posts} homenagens, sem aviso de teste. Aproveite!</p><div class="foot" style="justify-content:center"><button class="btn" id="tOk">Começar</button></div></div>`;
      $('tOk').onclick=()=>{ fecharFolha(); painelAdmin(); }; return;
    }
    if(/rejected|cancelled/.test(st)){ limpa(); $('cpT').innerHTML='O pagamento não foi aprovado. Você pode tentar de novo com outra forma de pagamento.'; const sp=document.querySelector('#sheet .spin'); if(sp) sp.remove(); return; }
    if(i===8 && $('cpT')) $('cpT').textContent='Ainda aguardando o Mercado Pago. Se você pagou por boleto, a confirmação pode levar até 1 dia útil — a festa libera sozinha quando chegar.';
    await sleep(i<15?4000:10000);
    if(!$('cpT')) return;
  }
}

    $('cgList').innerHTML = L.length ? `<p style="margin:0 0 6px;font-weight:600">${livres} livres · ${L.length-livres} usados</p>` + L.map(x=>`<div class="linkbox" style="margin-bottom:6px;${x.usado_em?'opacity:.55':''}"><code>${esc(x.codigo)} · ${ICONE_PLANO[x.plano]||''} ${esc(NOME_PLANO[x.plano]||x.plano||'')}${x.lote?` · ${esc(x.lote)}`:''}${x.usado_em?` · usado por ${esc(x.festa||'festa excluída')} em ${new Date(x.usado_em).toLocaleDateString('pt-BR')}`:''}</code>${x.usado_em?'':`<button class="btn sm" data-copy="${esc(x.codigo)}">Copiar</button>`}</div>`).join('') : '<p class="muted">Nenhum código ainda.</p>';
    $('cgList').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copiar(b.dataset.copy)); };
  $('cgGerar').onclick=async()=>{ const n=+$('cgN').value; if(!(n>=1&&n<=200)){ msgE('Escolha de 1 a 200.','err'); return; } try{ const novos=await rpc('fe_mestre_gerar_codigos',{p_pin:MPIN,p_qtd:n,p_lote:$('cgL').value.trim(),p_plano:$('cgP').value}); msgE(`${novos.length} códigos gerados!`,'ok'); carregar(); }catch(e){ msgE(ERR(e),'err'); } };
  $('cgCopiar').onclick=()=>{ const l=L.filter(x=>!x.usado_em).map(x=>x.codigo); if(!l.length){ msgE('Não há códigos livres.','err'); return; } copiar(l.join('\n'), `${l.length} códigos copiados (um por linha).`); };
  $('cgCsv').onclick=()=>{ const rows=[['codigo','lote','criado_em','usado_em','festa'],...L.map(x=>[x.codigo,x.lote||'',x.criado_em||'',x.usado_em||'',x.festa||''])]; const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download='codigos-mural-da-festa.csv'; a.click(); };
  carregar();
}
function trocarMestra(){
  abrirFolha(`<h3>🔑 Trocar senha mestra</h3><p class="muted" style="margin-top:0">A senha mestra abre o painel do organizador e a área de qualquer festa.</p>
   <label class="f">Nova senha (6 ou mais caracteres)<input class="in" id="tmN" type="password" autocomplete="new-password"></label><label class="f" style="margin-top:10px">Repita a nova senha<input class="in" id="tmR" type="password" autocomplete="new-password"></label>
   <div class="msg" id="eMsg"></div><div class="foot"><button class="btn ghost" id="eCancel">Cancelar</button><button class="btn" id="eSend">Trocar</button></div>`);
  $('eCancel').onclick=fecharFolha;
  $('eSend').onclick=async()=>{ const a=$('tmN').value, b=$('tmR').value; if(a.length<6){ msgE('Use pelo menos 6 caracteres.','err'); return; } if(a!==b){ msgE('As duas senhas não estão iguais.','err'); return; }
    try{ await rpc('fe_trocar_mestre',{p_pin:MPIN,p_nova:a}); MPIN=a; store.sset('mf_mestre',a); fecharFolha(); toast('Senha mestra trocada!'); }catch(e){ msgE(ERR(e),'err'); } };
}

const CONTATO = '';   // e-mail ou WhatsApp para pedidos de remoção e privacidade
const COMPRA_URL = '';   // link da página de venda da ativação (Kiwify, Hotmart, Mercado Pago…)
function telaTermos(){
  aplicarTema(TEMA_MARCA); document.title='Termos de uso e Privacidade · Mural da Festa';
  const canal = CONTATO ? `pelo contato <b>${esc(CONTATO)}</b>` : 'falando com o anfitrião da festa ou com o organizador que contratou o Mural da Festa';
  $('app').innerHTML=`<div class="wrap legal"><div class="card" style="padding:24px 22px">
  <h1 style="margin:0">Termos de uso e Política de Privacidade</h1><p class="muted">Mural da Festa · versão de 29/10/2026</p>
  <h2>1. O que é o Mural da Festa</h2>
  <p>Um serviço para festas e eventos em que convidados enviam fotos, recados escritos, áudios e vídeos de homenagem. O anfitrião aprova o que aparece no telão e no mural da festa e, ao final, pode baixar um álbum de recordações e os arquivos enviados.</p>
  <h2>2. Papéis</h2>
  <ul><li><b>Contratante / anfitrião:</b> quem contrata o mural de uma festa e recebe a senha de administração dela. É responsável pela festa, pela moderação e pelo tema escolhido.</li>
  <li><b>Convidado:</b> quem acessa o link ou o QR Code da festa e envia homenagens.</li>
  <li><b>Mural da Festa:</b> fornece a ferramenta e o armazenamento.</li></ul>
  <h2>3. Criação da festa, modo teste e ativação</h2>
  <p>O contratante cria a festa sozinho, nesta página, e define a senha de anfitrião. Sem pagamento, a festa funciona em <b>modo teste</b>: até 10 homenagens, com aviso de teste no telão, no álbum e no convite, e fica disponível até 7 dias depois da data da festa.</p>
  <p>A festa é liberada ao contratar um dos planos (Festinha, Festa ou Grande Evento), pagos uma única vez pelo Mercado Pago, ou com um código de ativação. Cada plano tem um limite de homenagens, um tempo máximo para áudios e vídeos e um prazo: a festa fica no ar até alguns dias depois da data da festa, conforme o plano escolhido. Depois desse prazo, a festa deixa de receber homenagens e os arquivos podem ser apagados — por isso, baixe o álbum e os arquivos antes. É possível mudar para um plano maior pagando a diferença. O contratante pode desistir em até 7 dias da compra, com reembolso integral, desde que a festa ainda não tenha acontecido. A guarda da senha é responsabilidade do contratante.</p>
  <h2>4. Conteúdo enviado pelos convidados</h2>
  <p>Quem envia uma foto, áudio, vídeo ou recado é responsável por ele. Ao enviar, o convidado declara que as pessoas que aparecem concordam com o envio e que, no caso de crianças e adolescentes, tem a autorização dos pais ou responsáveis. É proibido enviar conteúdo ofensivo, discriminatório, sexual, violento, ilegal ou que viole direitos de terceiros. O anfitrião pode não aprovar ou ocultar qualquer homenagem, e o Mural da Festa pode remover conteúdo que viole estes termos.</p>
  <h2>5. Tema próprio, fotos, músicas e direitos autorais</h2>
  <p>O anfitrião pode enviar imagens próprias para decorar a festa (fundo, personagens, enfeites), fotos do homenageado e músicas para tocar no telão. <b>O Mural da Festa não fornece personagens, marcas ou artes de terceiros.</b> Ao enviar um tema próprio, o anfitrião declara ter autorização para usar todos os elementos enviados e assume <b>integral e exclusiva responsabilidade</b> por eles, inclusive por direitos autorais, marcas e direitos de imagem, isentando o Mural da Festa. A declaração fica registrada com o nome do responsável, a festa, a data e a hora.</p>
  <p><b>Músicas:</b> as trilhas prontas são criadas pelo próprio Mural da Festa. Músicas enviadas pelo anfitrião são de sua inteira responsabilidade, inclusive os direitos de execução pública no local do evento (por exemplo, junto ao ECAD), quando exigidos.</p>
  <p>Se alguém (por exemplo, um titular de direitos) se sentir prejudicado por um tema ou conteúdo, pode pedir a remoção ${canal}. Ao receber um pedido fundamentado, o tema próprio pode ser desligado e o conteúdo removido, sem prejuízo da responsabilidade de quem o enviou.</p>
  <h2>6. Privacidade (LGPD)</h2>
  <ul><li><b>Dados tratados:</b> nome ou apelido informado (opcional), fotos, áudios, vídeos e recados enviados, data e hora do envio e um identificador técnico do aparelho, usado só para evitar envios repetidos. Do contratante, o nome, o contato informado na criação da festa e o nome do responsável pela declaração do tema.</li>
  <li><b>Para quê:</b> exibir as homenagens no telão e no mural da festa, montar o álbum de recordações e permitir que o anfitrião baixe os arquivos.</li>
  <li><b>Base legal:</b> consentimento de quem envia e execução do serviço contratado pelo anfitrião. Para imagens e vozes de crianças e adolescentes, o tratamento é feito no seu melhor interesse e depende do consentimento dos pais ou responsáveis (art. 14 da LGPD).</li>
  <li><b>Quem vê:</b> as homenagens aprovadas ficam visíveis para quem tem o link da festa. Os arquivos ficam guardados em provedor de nuvem contratado e são acessíveis pelo endereço de cada arquivo. Não vendemos nem compartilhamos dados com terceiros para publicidade.</li>
  <li><b>Por quanto tempo:</b> enquanto a festa estiver ativa e por até 90 dias depois da data de validade combinada com o contratante, ou menos, se ele pedir a exclusão antes. Depois disso, os dados podem ser apagados definitivamente.</li>
  <li><b>Seus direitos:</b> você pode pedir acesso, correção ou exclusão do que enviou, ou retirar o consentimento, ${canal}.</li></ul>
  <h2>7. Limitações</h2>
  <p>O serviço depende de internet e de provedores de nuvem e pode ter instabilidades. Recomendamos que o anfitrião baixe o álbum e os arquivos logo após a festa. O Mural da Festa não se responsabiliza por conteúdo enviado por usuários nem por temas enviados pelo anfitrião.</p>
  <h2>8. Mudanças nestes termos</h2>
  <p>Estes termos podem ser atualizados. A versão em vigor é sempre a publicada nesta página. Aplica-se a legislação brasileira.</p>
  </div><p class="center" style="margin-top:16px"><a class="btn ghost" href="${BASE}">Voltar</a></p></div>`;
}

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Mural da Festa</title><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
(function(){ var p=location.pathname, base=p.replace(/\/c\/.*$/,'/').replace(/[^\/]*$/,''), m=p.match(/\/c\/([a-z0-9-]+)/i);
  if(p.indexOf('/c/')>-1) base=p.slice(0,p.indexOf('/c/')+1);
  location.replace(base + (m ? '?f='+m[1] : '') + location.hash); })();
</script></head><body style="font-family:system-ui;text-align:center;padding:40px"><p>Abrindo o Mural da Festa…</p></body></html>
